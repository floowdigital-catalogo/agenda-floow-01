<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5b400">
<title>FLOOW Gestão</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0a0a0b; --ink-2:#121212; --surface:#181818; --surface-2:#202020;
    --line:#2c2c2d; --line-soft:#232323;
    --txt:#f4f2ec; --txt-dim:#a7a39a; --txt-faint:#6f6c64;
    --brand:#f5b400; --brand-2:#ffce3a; --brand-deep:#3a2c00; --on-brand:#1c1500;
    --danger:#f2675c; --ok:#36d399;
    --radius:14px; --shadow:0 18px 50px -20px rgba(0,0,0,.8);
    font-family:'Onest',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--ink);color:var(--txt)}
  body{min-height:100vh;
    background:
      radial-gradient(900px 520px at 88% -10%, rgba(245,180,0,.13), transparent 60%),
      radial-gradient(680px 480px at -6% 112%, rgba(245,180,0,.05), transparent 55%),
      var(--ink);
    padding:22px clamp(12px,3vw,34px) 80px;}
  h1,h2,h3{font-family:'Bricolage Grotesque',sans-serif;letter-spacing:-.02em}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  ::-webkit-scrollbar{height:9px;width:9px}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:20px}

  header.app{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
  .brand{display:flex;align-items:center;gap:13px}
  .mark{width:50px;height:50px;border-radius:50%;flex:none;
    background:radial-gradient(circle at 50% 38%,#1d1d1d,#0c0c0c);border:1px solid #2e2a1c;
    display:grid;place-items:center;
    box-shadow:0 8px 26px -10px rgba(245,180,0,.55), inset 0 0 0 1px rgba(245,180,0,.08);}
  .mark svg{width:30px;height:auto;display:block}
  .brand .name{font-size:25px;font-weight:800;line-height:1;letter-spacing:.01em}
  .brand .name b{color:var(--brand)}
  .brand .sub{font-size:12px;color:var(--txt-dim);margin-top:3px;letter-spacing:.06em;text-transform:uppercase}
  .user-chip{display:flex;align-items:center;gap:9px;background:var(--ink-2);border:1px solid var(--line-soft);border-radius:30px;padding:5px 6px 5px 13px}
  .uc-dot{width:11px;height:11px;border-radius:50%;flex:none}
  .uc-name{font-size:13.5px;font-weight:700}
  .uc-role{font-size:11px;color:var(--txt-faint);text-transform:uppercase;letter-spacing:.04em}
  .uc-btn{background:var(--surface);border:1px solid var(--line);color:var(--txt-dim);border-radius:20px;padding:6px 11px;font-size:12.5px;font-weight:600}
  .uc-btn:hover{color:var(--txt);border-color:var(--txt-faint)}
  .mine-badge{font-size:13px;font-weight:700;color:var(--brand);background:var(--brand-deep);border:1px solid color-mix(in srgb,var(--brand) 40%,transparent);padding:8px 14px;border-radius:9px}
  /* login */
  .login{display:grid;place-items:center;min-height:64vh;padding:20px}
  .login-card{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:30px 26px;box-shadow:var(--shadow);text-align:center}
  .mark.big{width:64px;height:64px;margin:0 auto 14px}
  .mark.big svg{width:40px}
  .login-card h2{font-size:22px;margin:0 0 2px}
  .login-card .login-sub{font-size:12.5px;color:var(--txt-dim);margin:0 0 18px;letter-spacing:.04em;text-transform:uppercase}
  .login-card label.f{text-align:left}
  /* users modal */
  .urow{background:var(--ink-2);border:1px solid var(--line);border-radius:11px;padding:11px;margin-bottom:9px}
  .urow-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .urow-top .uname{flex:1;font-weight:700}
  .uadmin{display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:var(--txt-dim);white-space:nowrap}
  .uadmin input{accent-color:var(--brand);width:16px;height:16px}
  .urow-grid{display:grid;grid-template-columns:1.4fr 1fr 1.2fr;gap:8px}
  @media(max-width:560px){.urow-grid{grid-template-columns:1fr}}

  /* config tab */
  .cfg-card{background:var(--ink-2);border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:10px}
  .cfg-top{display:flex;align-items:center;gap:10px;margin-bottom:9px}
  .cfg-top .uname{flex:1;font-weight:700;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;color:var(--txt);font-family:inherit;font-size:14px}
  .cfg-grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:8px;margin-bottom:11px}
  @media(max-width:560px){.cfg-grid2{grid-template-columns:1fr}}
  .cfg-dem-lbl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--txt-faint);margin-bottom:7px}
  .cfg-dems{display:flex;flex-wrap:wrap;gap:7px}
  .dembtn{border:1px solid var(--line);background:var(--surface);color:var(--txt-dim);border-radius:20px;padding:6px 12px;font-size:12px;font-weight:600;transition:.13s}
  .dembtn:hover{border-color:var(--txt-faint);color:var(--txt)}
  .dembtn.on{border-color:var(--brand);background:var(--brand-deep);color:var(--txt)}
  .cfg-sec-h{font-family:'Bricolage Grotesque';font-weight:700;font-size:16px;margin:26px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line-soft)}
  .cfg-sec-h:first-child{margin-top:4px}
  .cfg-side{float:right;font-family:'Onest';font-weight:500;font-size:11px;color:var(--txt-faint);max-width:55%;text-align:right}
  .cfg-add{width:100%;justify-content:center;margin-top:2px}
  .cfg-card .emoji{flex:none;width:48px;text-align:center;font-size:16px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 0;color:var(--txt);font-family:inherit}
  .cfg-link{display:flex;align-items:center;gap:9px}
  .cfg-link-lbl{font-size:11.5px;color:var(--txt-faint);flex:none}
  .cfg-link select{flex:1}
  .cfg-row{display:flex;align-items:center;gap:10px}
  .cfg-row .uname{flex:1}

  .tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--line-soft);padding-bottom:0}
  .tab{padding:10px 16px;font-size:14px;font-weight:700;color:var(--txt-faint);border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:7px}
  .tab.on{color:var(--txt);border-color:var(--brand)}
  .tab.sep{border-left:1px solid var(--line);margin-left:8px;padding-left:18px}
  .tab .badge{background:var(--surface-2);color:var(--txt-dim);font-size:11px;font-weight:700;padding:1px 7px;border-radius:20px}

  .toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--ink-2);border:1px solid var(--line-soft);border-radius:var(--radius);padding:11px 13px;margin-bottom:16px}
  .nav{display:flex;align-items:center;gap:4px}
  .nav button.arrow{width:34px;height:34px;border-radius:9px;background:var(--surface);border:1px solid var(--line);font-size:17px;color:var(--txt-dim);display:grid;place-items:center;transition:.15s}
  .nav button.arrow:hover{color:var(--brand);border-color:var(--brand)}
  .period{font-family:'Bricolage Grotesque';font-weight:700;font-size:19px;min-width:150px;text-align:center;text-transform:capitalize}
  .btn{border:1px solid var(--line);background:var(--surface);padding:8px 13px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--txt-dim);transition:.15s;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
  .btn:hover{color:var(--txt);border-color:var(--txt-faint)}
  .btn.ghost{background:transparent}
  .btn.primary{background:var(--brand);color:var(--on-brand);border-color:var(--brand);font-weight:700}
  .btn.primary:hover{filter:brightness(1.06);color:var(--on-brand)}
  .btn.on{border-color:var(--brand);color:var(--brand)}
  .seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .seg button{padding:8px 14px;font-size:13px;font-weight:600;color:var(--txt-dim)}
  .seg button.on{background:var(--surface-2);color:var(--txt)}
  .spacer{flex:1 1 30px}
  select.filter,input.search{background:var(--surface);border:1px solid var(--line);color:var(--txt);padding:8px 11px;border-radius:9px;font-size:13px;font-family:inherit}
  select.filter{max-width:180px}

  .legend{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;font-size:12.5px;color:var(--txt-dim)}
  .legend .chip{display:inline-flex;align-items:center;gap:6px;background:var(--ink-2);border:1px solid var(--line-soft);padding:4px 10px 4px 8px;border-radius:30px}
  .legend .dot{width:11px;height:11px;border-radius:50%;flex:none}

  .grid-head{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-bottom:7px}
  .grid-head div{font-size:11.5px;font-weight:600;color:var(--txt-faint);text-transform:uppercase;letter-spacing:.08em;padding-left:4px}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
  .cell{background:var(--ink-2);border:1px solid var(--line-soft);border-radius:11px;min-height:116px;padding:7px;display:flex;flex-direction:column;gap:4px;transition:.12s;cursor:pointer;overflow:hidden}
  .cell:hover{border-color:var(--line)}
  .cell.dim{opacity:.42}
  .cell.today{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
  .cell .dnum{font-size:12.5px;font-weight:600;color:var(--txt-dim);align-self:flex-start;padding:1px 2px}
  .cell.today .dnum{color:var(--brand)}
  .ev{border-radius:7px;padding:4px 7px;font-size:11.7px;font-weight:600;line-height:1.25;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 16%, transparent);color:var(--txt);display:flex;gap:5px;align-items:baseline;transition:.12s}
  .ev:hover{background:color-mix(in srgb,var(--c) 26%, transparent)}
  .ev .ti{font-size:10px;opacity:.8;font-weight:700;flex:none}
  .ev .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ev.done{opacity:.55}
  .ev.done .tx{text-decoration:line-through}
  .more{font-size:10.5px;color:var(--txt-faint);padding-left:4px}

  .week{display:flex;flex-direction:column;gap:9px}
  .wday{background:var(--ink-2);border:1px solid var(--line-soft);border-radius:12px;padding:13px 15px;display:flex;gap:16px;cursor:pointer;transition:.12s}
  .wday:hover{border-color:var(--line)}
  .wday.today{border-color:var(--brand)}
  .wday .wd-date{flex:none;width:62px}
  .wday .wd-dow{font-size:11.5px;color:var(--txt-faint);text-transform:uppercase;letter-spacing:.06em}
  .wday .wd-num{font-family:'Bricolage Grotesque';font-weight:700;font-size:26px;line-height:1.1}
  .wday.today .wd-num{color:var(--brand)}
  .wday .wd-evs{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
  .wday .empty{color:var(--txt-faint);font-size:13px;align-self:center}
  .wrow{display:flex;gap:9px;align-items:center;padding:7px 10px;border-radius:9px;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 13%, transparent);font-size:13.5px;transition:.12s}
  .wrow:hover{background:color-mix(in srgb,var(--c) 22%, transparent)}
  .wrow.done .wr-title{text-decoration:line-through;opacity:.6}
  .wrow .wr-time{font-size:12px;font-weight:700;color:var(--c);flex:none;width:52px}
  .wrow .wr-title{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;background:var(--surface-2);color:var(--txt-dim);flex:none}

  /* clients tab */
  .clients-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .clients-bar .search{flex:1;min-width:160px}
  .quickadd{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .quickadd input{background:transparent;border:none;color:var(--txt);font-family:inherit;font-size:13px;padding:8px 11px;width:180px}
  .quickadd input:focus{outline:none}
  .quickadd button{background:var(--brand);color:var(--on-brand);font-weight:700;font-size:13px;padding:8px 13px;white-space:nowrap}
  .quickadd button:hover{filter:brightness(1.06)}
  .ccode{font-size:11px;font-weight:700;color:var(--txt-faint);background:var(--surface-2);padding:1px 6px;border-radius:6px;flex:none}
  .cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:11px}
  .ccard{background:var(--ink-2);border:1px solid var(--line-soft);border-radius:13px;padding:14px 15px;cursor:pointer;transition:.13s;display:flex;flex-direction:column;gap:9px}
  .ccard:hover{border-color:var(--brand);transform:translateY(-1px)}
  .ccard .ctop{display:flex;align-items:center;gap:9px}
  .ccard .cdot{width:10px;height:10px;border-radius:50%;flex:none}
  .ccard .cname{font-family:'Bricolage Grotesque';font-weight:700;font-size:16.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ccard .cstat{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.04em}
  .cstat.ativo{background:rgba(54,211,153,.15);color:var(--ok)}
  .cstat.pausado{background:rgba(245,180,0,.15);color:var(--brand)}
  .cstat.arquivado{background:var(--surface-2);color:var(--txt-faint)}
  .hbadge{font-size:10px;font-weight:800;padding:3px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.04em;flex:none;color:var(--h);background:color-mix(in srgb,var(--h) 18%,transparent);border:1px solid color-mix(in srgb,var(--h) 40%,transparent)}
  .ccard .cmeta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--txt-dim)}
  .ccard .cmeta b{color:var(--txt)}
  .ccard .cnext{font-size:12px;color:var(--txt-faint);border-top:1px solid var(--line-soft);padding-top:8px}
  .ccard .cnext b{color:var(--txt-dim);font-weight:600}
  .empty-state{text-align:center;color:var(--txt-faint);padding:50px 20px;font-size:14px}

  /* client detail / timeline */
  .timeline{display:flex;flex-direction:column;gap:8px;margin-top:6px}
  .tl{display:flex;gap:11px;align-items:flex-start;padding:10px 12px;border-radius:10px;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);cursor:pointer;transition:.12s}
  .tl:hover{background:color-mix(in srgb,var(--c) 20%,transparent)}
  .tl .tl-d{flex:none;width:54px;text-align:center}
  .tl .tl-day{font-family:'Bricolage Grotesque';font-weight:700;font-size:18px;line-height:1}
  .tl .tl-mo{font-size:10px;color:var(--txt-faint);text-transform:uppercase}
  .tl .tl-body{flex:1;min-width:0}
  .tl .tl-t{font-weight:600;font-size:13.5px}
  .tl.done .tl-t{text-decoration:line-through;opacity:.6}
  .tl .tl-sub{font-size:11.5px;color:var(--txt-dim);margin-top:2px}

  .scrim{position:fixed;inset:0;background:rgba(4,4,5,.72);backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;padding:36px 16px;z-index:50;overflow:auto}
  .scrim.on{display:flex}
  .modal{background:var(--surface);border:1px solid var(--line);border-radius:18px;width:100%;max-width:440px;box-shadow:var(--shadow);padding:22px;animation:pop .18s ease}
  .modal.wide{max-width:560px}
  @keyframes pop{from{transform:translateY(8px) scale(.98);opacity:0}to{transform:none;opacity:1}}
  .modal h2{font-size:20px;margin:0 0 16px}
  .modal h2 .x{float:right;color:var(--txt-faint);font-size:22px;line-height:1;cursor:pointer}
  .modal h2 .x:hover{color:var(--txt)}
  .modal h2 small{display:block;font-family:'Onest';font-size:12px;font-weight:500;color:var(--txt-dim);margin-top:3px;letter-spacing:0}
  label.f{display:block;font-size:12px;font-weight:600;color:var(--txt-dim);margin:13px 0 5px;text-transform:uppercase;letter-spacing:.04em}
  input.t,select.t,textarea.t{width:100%;background:var(--ink-2);border:1px solid var(--line);border-radius:9px;padding:10px 11px;color:var(--txt);font-family:inherit;font-size:14px}
  input.t:focus,select.t:focus,textarea.t:focus{outline:none;border-color:var(--brand)}
  .two{display:flex;gap:10px}.two>div{flex:1}
  .typegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
  .typebtn{border:1px solid var(--line);background:var(--ink-2);border-radius:9px;padding:9px 4px;font-size:11.5px;font-weight:600;color:var(--txt-dim);display:flex;flex-direction:column;gap:3px;align-items:center;text-align:center}
  .typebtn.on{border-color:var(--brand);color:var(--txt);background:var(--brand-deep)}
  .typebtn .em{font-size:17px}
  .respgrid{display:flex;flex-wrap:wrap;gap:7px}
  .respbtn{border:1px solid var(--line);background:var(--ink-2);border-radius:30px;padding:6px 12px 6px 9px;font-size:12.5px;font-weight:600;color:var(--txt-dim);display:flex;align-items:center;gap:7px}
  .respbtn .dot{width:11px;height:11px;border-radius:50%;background:var(--c)}
  .respbtn.on{border-color:var(--c);color:var(--txt);background:color-mix(in srgb,var(--c) 16%,transparent)}
  .respbtn:disabled{cursor:default;opacity:1}
  .resp-note{font-size:11px;color:var(--txt-faint);align-self:center;margin-left:2px}
  .donetoggle{display:flex;align-items:center;gap:9px;margin-top:14px;background:var(--ink-2);border:1px solid var(--line);border-radius:9px;padding:11px 12px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--txt-dim)}
  .donetoggle.on{border-color:var(--brand);color:var(--txt)}
  .donetoggle .box{width:19px;height:19px;border-radius:5px;border:1.5px solid var(--txt-faint);display:grid;place-items:center;font-size:13px;flex:none}
  .donetoggle.on .box{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
  .modal-actions{display:flex;gap:9px;margin-top:20px}
  .modal-actions .btn{flex:1;justify-content:center;padding:11px}
  .del{flex:none!important;border-color:transparent;background:transparent;color:var(--danger)}
  .del:hover{background:rgba(242,103,92,.12)}
  .del.armed{background:var(--danger);color:#fff;border-color:var(--danger)}

  .member{display:flex;align-items:center;gap:10px;background:var(--ink-2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:8px}
  .member input.tname{flex:1;background:transparent;border:none;color:var(--txt);font-family:inherit;font-size:14px;font-weight:600}
  .member input.tname:focus{outline:none}
  .member input.tcolor{width:30px;height:30px;border:none;background:none;padding:0;border-radius:8px;cursor:pointer;flex:none}
  .member .rm{color:var(--txt-faint);font-size:18px;flex:none}
  .member .rm:hover{color:var(--danger)}

  .copybox{background:var(--ink-2);border:1px solid var(--line);border-radius:10px;padding:13px;font-size:13px;white-space:pre-wrap;line-height:1.5;max-height:300px;overflow:auto;color:var(--txt-dim)}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--brand);color:var(--on-brand);padding:11px 20px;border-radius:30px;font-weight:700;font-size:13.5px;opacity:0;transition:.25s;z-index:90;box-shadow:var(--shadow)}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .loading{display:grid;place-items:center;min-height:50vh;color:var(--txt-dim);gap:12px}
  .spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .empty-hint{color:var(--txt-faint);font-size:12.5px;margin-top:6px}

  @media(max-width:720px){
    .cell{min-height:84px}
    .period{min-width:118px;font-size:16px}
    .grid-head div{font-size:10px;text-align:center;padding:0}
    .spacer{flex-basis:100%}
  }

  /* week load + range */
  .wr-time{width:84px!important}
  .wd-load{font-size:10.5px;color:var(--txt-faint);margin-top:3px}

  /* day summary + capacity */
  .day-summary{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;background:var(--ink-2);border:1px solid var(--line-soft);border-radius:12px;padding:12px 15px;margin-bottom:12px;font-size:14px;color:var(--txt-dim)}

<!-- Polyfill de window.storage -> localStorage (mantém a API do ambiente original) -->
<script>
  (function(){
    var PREFIX='floow:';
    function k(key){return PREFIX+key;}
    window.storage={
      get:function(key /*, shared */){
        return Promise.resolve().then(function(){
          var raw=localStorage.getItem(k(key));
          return raw===null?null:{value:raw};
        });
      },
      set:function(key,value /*, shared */){
        return Promise.resolve().then(function(){
          localStorage.setItem(k(key), typeof value==='string'?value:JSON.stringify(value));
          return {ok:true};
        });
      },
      delete:function(key /*, shared */){
        return Promise.resolve().then(function(){
          localStorage.removeItem(k(key));
          return {ok:true};
        });
      },
      list:function(/* shared */){
        return Promise.resolve().then(function(){
          var keys=[];
          for(var i=0;i<localStorage.length;i++){
            var f=localStorage.key(i);
            if(f&&f.indexOf(PREFIX)===0)keys.push(f.slice(PREFIX.length));
          }
          return {keys:keys};
        });
      }
    };
    // A agenda aguarda esta Promise antes de ler os dados. O backend opcional
    // (Supabase, em /src/main.js) a resolve quando termina de configurar.
    var resolved=false, _resolve;
    window.__storageReady=new Promise(function(r){
      _resolve=function(){ if(!resolved){resolved=true;r();} };
    });
    window.__resolveStorageReady=function(){ if(_resolve)_resolve(); };
    // Rede de segurança: libera mesmo que o módulo falhe ao carregar.
    setTimeout(function(){ window.__resolveStorageReady(); }, 2500);
  })();
</script>

function ensureChecklist(c){if(!c.checklist)c.checklist={};CHECK_().forEach(i=>{if(!(i.id in c.checklist))c.checklist[i.id]=false;});}

const MONTHS_S=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];

const isCS=()=>!!(currentUser&&currentUser.isCS&&!currentUser.isAdmin); // Customer Success: gerencia, mas SEM Financeiro/Config/Horas

const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseISO=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const sameDay=(a,b)=>iso(a)===iso(b);
const esc=s=>String(s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function userById(id){return (state.users||[]).find(u=>u.id===id);}
function respColor(id){const u=userById(id);return u&&u.color?u.color:'#6f6c64';}
function respName(id){const u=userById(id);return u?u.name:'—';}
function respForDemand(typeId){return (state.users||[]).filter(u=>u.demands&&u.demands.includes(typeId));}
function adminUsers(){return (state.users||[]).filter(u=>u.isAdmin);}
function typeOf(id){return TYPES_().find(t=>t.id===id)||{id,em:'📌',label:'—',link:null};}
function typeWantsLoc(typeId){const t=typeOf(typeId);return !!(t&&(t.id==='captacao'||/capta/i.test(t.label||'')));}
function typeIsOnline(typeId){const t=typeOf(typeId);if(!t)return false;if(t.online)return true;
  return /acompanhamento comercial|kick|alinhamento estrat/i.test(t.label||'');} // reuniões online geram Meet (+ marque "🎥 Reunião online" no Config p/ outras)
function updateLocField(){
  const w=$('#fLocWrap');if(w)w.style.display=typeWantsLoc(draftType)?'':'none';
  const m=$('#fMeetWrap');if(m)m.style.display=typeIsOnline(draftType)?'':'none';
}
function typeDur(typeId){const t=typeOf(typeId);return (t&&t.dur>0)?t.dur:60;} // tempo médio (min); padrão 60
function eventDuration(ev){const s=toMin(ev.time),e=toMin(ev.end);if(s!=null&&e!=null&&e>s)return e-s;return typeDur(ev.type);} // real se houver início+fim; senão a média
function clientById(id){return state.clients.find(c=>c.id===id);}
function clientName(id){const c=clientById(id);return c?c.name:'(sem cliente)';}
const toMin=t=>{if(!t)return null;const[h,m]=t.split(':').map(Number);return h*60+m;};
const fmtDur=min=>{if(min<=0)return'';const h=Math.floor(min/60),m=min%60;return h?(m?`${h}h${pad(m)}`:`${h}h`):`${m}min`;};
const fmtBRL=n=>'R$ '+(Number(n)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtRange=ev=>ev.time?(ev.end?`${ev.time}–${ev.end}`:ev.time):'';
const addMinHHMM=(t,min)=>{const m=toMin(t)+min;return `${pad(Math.floor(m/60)%24)}:${pad(m%60)}`;};
const nextDay=isoStr=>{const d=parseISO(isoStr);d.setDate(d.getDate()+1);return iso(d);};
function dayLoad(d){
  const evs=eventsOn(d);let mins=0,timed=0,untimed=0;
  evs.forEach(e=>{const s=toMin(e.time),en=toMin(e.end);if(s!=null&&en!=null&&en>s){mins+=en-s;timed++;}else if(s!=null){timed++;}else untimed++;});
  return {count:evs.length,mins,timed,untimed};
}
function loadLabel(d){const l=dayLoad(d);if(!l.count)return'';return `${l.count} demanda${l.count>1?'s':''}${l.mins?' · '+fmtDur(l.mins):''}`;}

/* ---------- persistence (SHARED) ---------- */
async function load(){
  try{const r=await window.storage.get(STORE_KEY,true);if(r&&r.value){state=JSON.parse(r.value);}}catch(e){}
  if(!state){seed();await saveData();}
  if(!state.users)state.users=[];
  if(!state.types)state.types=JSON.parse(JSON.stringify(DEF_TYPES));
  if(!state.checklist)state.checklist=JSON.parse(JSON.stringify(DEF_CHECKLIST));
  if(!state.expenses)state.expenses=[];
  if(!state.expensesSeeded){if(!state.expenses.length)state.expenses=DEFAULT_EXPENSES();state.expensesSeeded=true;}
  if(!state.tombstones)state.tombstones={events:{},clients:{}};
  if(!state.tombstones.events)state.tombstones.events={};
  if(!state.tombstones.clients)state.tombstones.clients={};
  let sid=null;
  try{const r=await window.storage.get(SESSION_KEY,false);if(r&&r.value)sid=JSON.parse(r.value);}catch(e){}
  currentUser=sid?state.users.find(u=>u.id===sid)||null:null;
}
/* mescla duas listas (eventos/clientes) por id, mantendo a versão mais recente
   e respeitando exclusões (tombstones). Evita que um cliente apague o que o
   outro criou ao salvar por cima. */
function mergeArrById(remoteArr,localArr,tomb){
  const map={};
  (remoteArr||[]).forEach(x=>{if(x&&x.id)map[x.id]=x;});
  (localArr||[]).forEach(x=>{
    if(!x||!x.id)return;
    const ex=map[x.id];
    if(!ex)map[x.id]=x;
    else map[x.id]=((x.updatedAt||0)>=(ex.updatedAt||0))?x:ex;
  });
  return Object.values(map).filter(x=>{
    const t=tomb[x.id];
    return !(t&&t>=(x.updatedAt||0)); // removido depois da última edição
  });
}
function mergeTomb(a,b){
  const out={...(a||{})};
  Object.entries(b||{}).forEach(([id,ts])=>{if(!out[id]||ts>out[id])out[id]=ts;});
  return out;
}
function mergeStates(remote,local){
  if(!remote)return local;
  if(!local)return remote;
  const rt=remote.tombstones||{}, lt=local.tombstones||{};
  const tomb={events:mergeTomb(rt.events,lt.events),clients:mergeTomb(rt.clients,lt.clients)};
  // CONFIG (usuários/demandas/checklist/drive) = a versão MAIS RECENTE pelo carimbo cfgUpdatedAt.
  // Assim a cópia antiga de outro usuário não apaga mudanças do Config (ex.: ✅ Agenda do responsável).
  const cfgSrc=((local.cfgUpdatedAt||0)>=(remote.cfgUpdatedAt||0))?local:remote;
  return {
    ...remote, ...local,
    users:cfgSrc.users, types:cfgSrc.types, checklist:cfgSrc.checklist,
    driveRoot:cfgSrc.driveRoot, driveTree:cfgSrc.driveTree, driveShares:cfgSrc.driveShares, driveTemplates:cfgSrc.driveTemplates,
    cfgUpdatedAt:Math.max(local.cfgUpdatedAt||0,remote.cfgUpdatedAt||0),
    events:mergeArrById(remote.events,local.events,tomb.events),
    clients:mergeArrById(remote.clients,local.clients,tomb.clients),
    tombstones:tomb,
    version:9
  };
}
let saveChain=Promise.resolve();
async function saveData(){
  // serializa as gravações e mescla com o remoto antes de escrever
  saveChain=saveChain.then(async()=>{
    try{
      let remote=null;
      try{const r=await window.storage.get(STORE_KEY,true);if(r&&r.value)remote=JSON.parse(r.value);}catch(e){}
      if(remote)state=mergeStates(remote,state);
      await window.storage.set(STORE_KEY,JSON.stringify(state),true);
    }catch(e){console.error(e);toast('Erro ao salvar');}
  });
  return saveChain;
}
// recarrega/mescla a agenda quando a aba volta ao foco (vê mudanças da equipe sem F5)
async function refreshFromCloud(){
  if(!currentUser||!state)return;
  if(document.querySelector('.scrim.on'))return; // não interromper edição em modal
  try{const r=await window.storage.get(STORE_KEY,true);if(r&&r.value){const remote=JSON.parse(r.value);state=mergeStates(remote,state);render();}}catch(e){}

  let c=state.clients.find(x=>x.name.toLowerCase()===p.name.toLowerCase());

/* ---------- otimizações / desempenho (admin) ---------- */
function nextOptDate(c){if(!c.optDate)return null;const d=parseISO(c.optDate);d.setDate(d.getDate()+7);return d;}
function optAlertLevel(c){const n=nextOptDate(c);if(!n)return '';const t=new Date();t.setHours(0,0,0,0);const diff=Math.round((n-t)/86400000);if(diff<=0)return 'red';if(diff<=2)return 'yellow';return '';}
function recomputeHealth(c){const sold=c.weekSold;if(sold===undefined||sold===null)return;c.health=sold?(c.prevWeekSold===true?'excelente':'bom'):(c.prevWeekSold===false?'ruim':'observacao');}
function markSold(cid,sold){const c=clientById(cid);if(!c)return;const cur=iso(startOfWeek(new Date()));if(c.weekKey!==cur){c.prevWeekSold=c.weekSold;c.weekKey=cur;}c.weekSold=sold;recomputeHealth(c);touch(c);saveData();renderOptInner();}
function setOptDate(cid,v){const c=clientById(cid);if(!c)return;c.optDate=v||'';touch(c);saveData();renderOptInner();}
function setOptDaily(cid,v){const c=clientById(cid);if(!c)return;c.dailyValue=Number(v)||0;touch(c);saveData();}
function setOptNotes(cid,v){const c=clientById(cid);if(!c)return;c.optNotes=v;touch(c);saveData();}
function setOptStatus(cid,v){const c=clientById(cid);if(!c)return;c.status=v;touch(c);saveData();renderOptInner();}
function clientComercialUrl(c){const raw=c.code?painelMap()[String(c.code)]:null;return (raw&&raw.comercialUrl)||'';}
function clientSituacaoRange(c,fromISO,toISO){ // situação automática do cliente numa semana específica
  const raw=c.code?painelMap()[String(c.code)]:null;if(!raw)return 'sem';
  const ok=d=>d&&d>=fromISO&&d<=toISO;let inv=0,conv=0,vendas=0,fat=0;
  (Array.isArray(raw.semanas)?raw.semanas:[]).forEach(w=>{if(ok(w.d)){inv+=Number(w.inv)||0;conv+=Number(w.conv)||0;}});
  (Array.isArray(raw.vendas)?raw.vendas:[]).forEach(s=>{if(ok(s.d)){vendas++;fat+=Number(s.v)||0;}});
  return resultAuto({investido:inv,conversas:conv,vendas:vendas,faturamento:fat},resultCfg());
}
function renderOpt(app){app.insertAdjacentHTML('beforeend','<div id="optWrap"></div>');if(!painelLoaded&&!painelLoading)loadPainel();renderOptInner();}
function renderOptInner(){
  const wrap=$('#optWrap');if(!wrap)return;
  const cs=state.clients.slice().filter(c=>c.status!=='arquivado').sort((a,b)=>{const ca=parseInt(a.code),cb=parseInt(b.code);if(!isNaN(ca)&&!isNaN(cb))return ca-cb;return a.name.localeCompare(b.name,'pt');});
  const ativos=state.clients.filter(c=>c.status==='ativo').length;
  const vencidas=cs.filter(c=>optAlertLevel(c)==='red').length, proximas=cs.filter(c=>optAlertLevel(c)==='yellow').length;
  const fmtD=d=>`${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`;
  // últimas 4 semanas (segunda→domingo), da mais antiga p/ a atual
  const hoje=new Date(), weeks=[];
  for(let k=3;k>=0;k--){const mon=startOfWeek(hoje);mon.setDate(mon.getDate()-7*k);const fri=new Date(mon);fri.setDate(mon.getDate()+4);const sun=new Date(mon);sun.setDate(mon.getDate()+6);
    weeks.push({from:iso(mon),to:iso(sun),label:`${pad(mon.getDate())}/${pad(mon.getMonth()+1)}–${pad(fri.getDate())}/${pad(fri.getMonth()+1)}`});}
  const rows=cs.map(c=>{
    const al=optAlertLevel(c);const nx=nextOptDate(c);
    const prox=al==='red'?`<span class="opt-venc">${nx?fmtD(nx):'—'} ⚠</span>`:`${nx?fmtD(nx):'—'}`;
    const wcells=weeks.map(w=>{const m=resultMeta(clientSituacaoRange(c,w.from,w.to));return `<td class="opt-wk" title="${w.label}: ${m.label}">${m.em}</td>`;}).join('');
    const url=clientComercialUrl(c);
    const link=url?`<a class="btn ghost opt-link" href="${esc(url)}" target="_blank" rel="noopener">Comercial ↗</a>`:'<span style="color:var(--txt-faint)">—</span>';
    const stSel=`<select class="filter" onchange="setOptStatus('${c.id}',this.value)">${[['ativo','🟢 Ativo'],['pausado','⏸ Pausado']].map(o=>`<option value="${o[0]}" ${c.status===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>`;
    return `<tr>
      <td class="res-cli">${c.code?`<span class="ccode">#${esc(c.code)}</span> `:''}${esc(c.name)}</td>
      <td><span style="display:flex;align-items:center;gap:3px"><b>R$</b><input class="t res-note" style="width:72px" type="number" min="0" step="1" value="${c.dailyValue||''}" placeholder="0" onchange="setOptDaily('${c.id}',this.value)"></span></td>
      <td><input class="t" style="width:140px" type="date" value="${c.optDate||''}" onchange="setOptDate('${c.id}',this.value)"></td>
      <td>${prox}</td>
      ${wcells}
      <td>${stSel}</td>
      <td><div style="display:flex;gap:4px;align-items:center;flex-wrap:wrap">${link}<button class="btn ghost opt-link" onclick="copyCampanhas('${c.id}')" title="Copiar aviso de 'campanhas ativas' pro grupo do cliente">🚀 Avisar</button></div></td>
      <td><input class="t res-note" value="${esc(c.optNotes||'')}" placeholder="o que foi feito…" onchange="setOptNotes('${c.id}',this.value)"></td>
    </tr>`;}).join('');
  wrap.innerHTML=`
    <div class="metrics" style="margin-bottom:14px">
      <div class="metric"><div class="mv">${ativos}</div><div class="ml">Clientes ativos</div></div>
      <div class="metric ${vencidas?'alert':''}"><div class="mv">${vencidas}</div><div class="ml">🔴 Otimizações vencidas</div></div>
      <div class="metric"><div class="mv">${proximas}</div><div class="ml">🟡 Próximas (1-2 dias)</div></div>
    </div>
    <div class="empty-hint" style="margin:-4px 0 12px">As 4 semanas mostram a <b>tendência</b> (🟢 Excelente · 🔵 Bom · 🟡 Observação · 🔴 Ruim) — calculada sozinha pelos resultados. A próxima otimização é 7 dias após a última.</div>
    <div class="panel" style="overflow-x:auto">
      <table class="res-table">
        <thead><tr><th>Cliente</th><th>Valor diário</th><th>Última otim.</th><th>Próxima otim.</th>${weeks.map(w=>`<th class="opt-wk">${w.label}</th>`).join('')}<th>Status</th><th>Comercial</th><th>O que foi feito</th></tr></thead>
        <tbody>${rows||`<tr><td colspan="${7+weeks.length}" class="empty-hint">Nenhum cliente.</td></tr>`}</tbody>
      </table>
    </div>`;
}

/* ---------- horas trabalhadas (admin) ---------- */
function setHoursView(v){hoursView=v;render();}
function hoursStep(n){const d=new Date(hoursWeek);if(hoursView==='day')d.setDate(d.getDate()+n);else if(hoursView==='month')d.setMonth(d.getMonth()+n);else d.setDate(d.getDate()+7*n);hoursWeek=d;render();}
function hoursToday(){hoursWeek=new Date();render();}
function renderHours(app){
  const c=hoursWeek;let startIso,endIso,period,scope;
  if(hoursView==='day'){startIso=endIso=iso(c);period=`${DOW[c.getDay()]}, ${c.getDate()} ${MONTHS_S[c.getMonth()]}`;scope='no dia';}
  else if(hoursView==='month'){const s=new Date(c.getFullYear(),c.getMonth(),1),e=new Date(c.getFullYear(),c.getMonth()+1,0);startIso=iso(s);endIso=iso(e);period=`${MONTHS[c.getMonth()]} ${c.getFullYear()}`;scope='no mês';}
  else{const s=startOfWeek(c),e=new Date(s);e.setDate(s.getDate()+6);startIso=iso(s);endIso=iso(e);period=`${s.getDate()} ${MONTHS_S[s.getMonth()]} – ${e.getDate()} ${MONTHS_S[e.getMonth()]}`;scope='na semana';}
  const done=state.events.filter(e=>e.done&&e.date>=startIso&&e.date<=endIso);
  const rows=state.users.map(u=>{const evs=done.filter(e=>e.resp===u.id);return {u,mins:evs.reduce((s,e)=>s+eventDuration(e),0),count:evs.length};}).filter(r=>r.count>0).sort((a,b)=>b.mins-a.mins);
  const totalMins=rows.reduce((s,r)=>s+r.mins,0);
  const maxMins=Math.max(1,...rows.map(r=>r.mins));
  const list=rows.length?rows.map(r=>`
    <div class="loadrow">
      <span class="ln">${esc(r.u.name)}</span>
      <div class="lbar"><span style="width:${r.mins/maxMins*100}%;background:${r.u.color||'#888'}"></span></div>
      <span class="ln-n" style="width:110px">${fmtDur(r.mins)||'0min'} · ${r.count}</span>
    </div>`).join(''):`<div class="empty-state">Nenhuma demanda concluída ${scope}.</div>`;
  app.insertAdjacentHTML('beforeend',`
    <div class="toolbar">
      <div class="nav"><button class="arrow" onclick="hoursStep(-1)">‹</button><div class="period">${period}</div><button class="arrow" onclick="hoursStep(1)">›</button></div>
      <button class="btn ghost" onclick="hoursToday()">Hoje</button>
      <div class="seg">
        <button class="${hoursView==='day'?'on':''}" onclick="setHoursView('day')">Dia</button>
        <button class="${hoursView==='week'?'on':''}" onclick="setHoursView('week')">Semana</button>
        <button class="${hoursView==='month'?'on':''}" onclick="setHoursView('month')">Mês</button>
      </div>
      <div class="spacer"></div>
      <span class="mine-badge">⏱ ${fmtDur(totalMins)||'0min'}</span>
    </div>
    <div class="panel"><h3>Horas trabalhadas <span class="h3-side">por colaborador · concluídas ${scope}</span></h3>${list}</div>
    <div class="empty-hint" style="margin-top:10px">⏱ Conta a duração real (início–fim) de cada tarefa concluída; quando a tarefa não tem horário, usa o <b>tempo médio</b> configurado da demanda (Config). O número ao lado das horas = quantidade de tarefas concluídas.</div>`);
}

/* ---------- tasks board ---------- */
function renderTasks(app){
  const today=iso(new Date());
  const byDate=(a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||''));
  const itemHtml=(e,over)=>{const d=parseISO(e.date);const dd=`${pad(d.getDate())}/${pad(d.getMonth()+1)}`;
    return `<div class="tk${over?' over':''}" onclick="openEv('${e.id}')"><span class="tk-d">${over?'⚠ ':''}${dd}${fmtRange(e)?' · '+fmtRange(e):''}</span><span class="tk-t">${prioDot(e)}${typeOf(e.type).em} ${esc(e.title)}<span class="tk-c"> · ${esc(clientName(e.clientId))}</span></span></div>`;};
  const members=canManage()?state.users:state.users.filter(m=>m.id===myMember());
  let totalOver=0;members.forEach(m=>{totalOver+=state.events.filter(e=>e.resp===m.id&&!e.done&&e.date<today).length;});
  const head=`<div class="list-head">${canManage()?'Tarefas por usuário':'Suas tarefas'} · <b class="${totalOver?'bad':''}">${totalOver} atrasada${totalOver===1?'':'s'}</b></div>`;
  const panels=members.map(m=>{
    const mine=state.events.filter(e=>e.resp===m.id);
    const overdue=mine.filter(e=>!e.done&&e.date<today).sort(byDate);
    const todo=mine.filter(e=>!e.done&&e.date>=today).sort(byDate);
    const doneCount=mine.filter(e=>e.done).length;
    return `<div class="tpanel" style="--c:${m.color}">
      <div class="tp-head"><span class="dot"></span><span class="tp-name">${esc(respName(m.id))}</span><span class="tp-counts">${overdue.length?`<b class="bad">${overdue.length} atras.</b> · `:''}${todo.length} a fazer</span></div>
      ${overdue.length?`<div class="tp-sec bad-sec">⚠ Atrasadas</div>`+overdue.map(e=>itemHtml(e,true)).join(''):''}
      <div class="tp-sec">A fazer</div>
      ${todo.length?todo.map(e=>itemHtml(e,false)).join(''):'<div class="tp-empty">Nada pendente 🎉</div>'}
      ${doneCount?`<div class="tp-done">✓ ${doneCount} concluída${doneCount===1?'':'s'}</div>`:''}
    </div>`;}).join('');
  app.insertAdjacentHTML('beforeend',head+`<div class="tasks-grid">${panels}</div>`);
}

function renderDeliverGrid(){

  const grid=document.createElement('div');grid.className='deliver-grid';

    const done=deliverDone(c),na=deliverNA(c),eff=deliverTotal(c),pct=eff>0?Math.round(done/eff*100):100;

  }).join('');
  wrap.innerHTML='';wrap.appendChild(grid);

const DL_STATES={todo:{label:'A fazer',icon:'○'},doing:{label:'Fazendo',icon:'◐'},feito:{label:'Feito',icon:'✔'},na:{label:'Não precisa',icon:'⊘'}};
function dlState(v){return v===true?'feito':v==='doing'?'doing':v==='na'?'na':'todo';}
function cycleDeliverable(cid,iid){const c=clientById(cid);if(!c)return;ensureChecklist(c);
  const v=c.checklist[iid];
  c.checklist[iid]=(v===false||v===undefined||v===null)?'doing':(v==='doing')?true:(v===true)?'na':false; // A fazer→Fazendo→Feito→Não precisa→A fazer
  touch(c);saveData();renderDeliverGrid();}

function renderMonth(app){

function renderWeek(app){

  let anyUnt=false,unt=`<div class="wg-cnr sm">sem<br>hora</div>`;
  days.forEach(d=>{const us=eventsOn(d).filter(e=>toMin(e.time)==null);if(us.length)anyUnt=true;
    unt+=`<div class="wg-ut">${us.map(x=>{const c=respColor(x.resp);return `<span class="wg-utc${x.done?' done':''}" style="--c:${c}" onclick="openEv('${x.id}')" title="${esc(x.title)} · ${esc(clientName(x.clientId))}">${prioDot(x)}${typeOf(x.type).em} ${esc(x.title)}</span>`;}).join('')}</div>`;});
  let gut='';for(let h=START;h<=END;h++)gut+=`<div class="wg-hl" style="top:${(h-START)*HPX}px">${h<24?pad(h)+':00':''}</div>`;
  let cols='';
  days.forEach(d=>{

    const L=packLanes(timed);

    let blk='';

      const top=(s-START*60)/60*HPX, height=Math.max((en-s)/60*HPX-2,20);
      const lane=L.lane[x.id],nc=L.cols[x.id],w=100/nc,left=lane*w,c=respColor(x.resp);
      blk+=`<div class="wg-ev${x.done?' done':''}" style="--c:${c};top:${top}px;height:${height}px;left:calc(${left}% + 1px);width:calc(${w}% - 3px)" onclick="event.stopPropagation();openEv('${x.id}')"><span class="wg-et">${fmtRange(x)||''}</span><span class="wg-en">${prioDot(x)}${typeOf(x.type).em} ${esc(x.title)}</span></div>`;
    });
    let now='';if(sameDay(d,today)){const nm=today.getHours()*60+today.getMinutes();if(nm>=START*60&&nm<=END*60)now=`<div class="wg-now" style="top:${(nm-START*60)/60*HPX}px"></div>`;}
    cols+=`<div class="wg-col${sameDay(d,today)?' today':''}" style="height:${H}px" onclick="wgClick(event,'${iso(d)}',${START},${HPX})">${lines}${blk}${now}</div>`;
  });
  app.insertAdjacentHTML('beforeend',`
    <div class="wg-scroll"><div class="wg">
      <div class="wg-head">${head}</div>
      ${anyUnt?`<div class="wg-utrow">${unt}</div>`:''}
      <div class="wg-body">
        <div class="wg-gut" style="height:${H}px">${gut}</div>
        ${cols}
      </div>
    </div></div>`);
  const body=app.querySelector('.wg-body');if(body)setTimeout(()=>{body.scrollTop=Math.max(0,(9-START)*HPX-HPX);},0);

const DAY_START=0, DAY_END=24, HOURPX=56;

  const d=cursor;const evs=eventsOn(d);

    app.appendChild(u);

  const timed=evs.filter(e=>toMin(e.time)!=null).slice().sort((a,b)=>toMin(a.time)-toMin(b.time));
  const lanes=packLanes(timed);
  const grid=document.createElement('div');grid.className='daygrid';
  grid.style.height=((DAY_END-DAY_START)*HOURPX)+'px';
  let hours='';
  for(let h=DAY_START;h<=DAY_END;h++){
    hours+=`<div class="hrow" style="top:${(h-DAY_START)*HOURPX}px">${h<24?`<span class="hlbl">${pad(h)}:00</span>`:''}</div>`;
  }
  grid.innerHTML=hours;
  grid.onclick=e=>{
    if(!e.target.classList.contains('daygrid')&&!e.target.classList.contains('hrow'))return;
    const y=e.offsetY;const h=Math.min(23,DAY_START+Math.floor(y/HOURPX));
    openEv(null,iso(d));setTimeout(()=>{$('#fTime').value=`${pad(h)}:00`;autoEnd();},30);
  };
  timed.forEach(x=>{
    const s=toMin(x.time);let en=toMin(x.end);if(en==null||en<=s)en=s+45;
    const top=(s-DAY_START*60)/60*HOURPX;
    const height=Math.max((en-s)/60*HOURPX-3,22);
    const c=respColor(x.resp);
    const lane=lanes.lane[x.id], cols=lanes.cols[x.id];
    const w=`calc((100% - 58px)/${cols})`;
    const left=`calc(58px + (100% - 58px)/${cols}*${lane})`;
    const blk=document.createElement('div');
    blk.className='dblk'+(x.done?' done':'');
    blk.style.cssText=`--c:${c};top:${top}px;height:${height}px;left:${left};width:${w}`;
    blk.onclick=ev=>{ev.stopPropagation();openEv(x.id);};
    blk.innerHTML=`<div class="db-t">${prioDot(x)}${typeOf(x.type).em} ${esc(x.title)}</div><div class="db-s">${fmtRange(x)} · ${esc(clientName(x.clientId))}${x.loc?' · 📍'+esc(x.loc):''}${x.obs?' · 📝'+esc(x.obs):''}</div><div class="db-r">${esc(respName(x.resp))}</div>`;
    grid.appendChild(blk);
  });
  if(today){
    const now=new Date();const nm=now.getHours()*60+now.getMinutes();
    if(nm>=DAY_START*60&&nm<=DAY_END*60){
      const line=document.createElement('div');line.className='nowline';
      line.style.top=((nm-DAY_START*60)/60*HOURPX)+'px';grid.appendChild(line);
    }
  }
  const dgWrap=document.createElement('div');dgWrap.className='daygrid-wrap';dgWrap.appendChild(grid);app.appendChild(dgWrap);
  // abre a grade já na hora atual (ou ~07h em outros dias), já que mostramos 24h
  const scrollTo=today?Math.max(0,(new Date().getHours()-1)*HOURPX):7*HOURPX;
  setTimeout(()=>{dgWrap.scrollTop=scrollTo;},0);

function capacityBar(mins){
  const max=8*60;const pct=Math.min(100,Math.round(mins/max*100));
  const col=pct<60?'var(--ok)':pct<90?'var(--brand)':'var(--danger)';
  return `<div class="capbar"><span style="width:${pct}%;background:${col}"></span></div><span class="caplbl">${pct}% de 8h</span>`;
}
function packLanes(evs){
  // simple lane packing for overlapping timed events
  const lane={},cols={};const active=[];
  evs.forEach(e=>{
    const s=toMin(e.time);let en=toMin(e.end);if(en==null||en<=s)en=s+45;
    for(let i=active.length-1;i>=0;i--){if(active[i].end<=s)active.splice(i,1);}
    const used=new Set(active.map(a=>a.lane));let l=0;while(used.has(l))l++;
    lane[e.id]=l;active.push({end:en,lane:l,id:e.id});
  });
  // compute columns per overlap cluster
  evs.forEach(e=>{
    const s=toMin(e.time);let en=toMin(e.end);if(en==null||en<=s)en=s+45;
    let maxLane=lane[e.id];
    evs.forEach(o=>{const os=toMin(o.time);let oe=toMin(o.end);if(oe==null||oe<=os)oe=os+45;
      if(os<en&&oe>s)maxLane=Math.max(maxLane,lane[o.id]);});
    cols[e.id]=maxLane+1;
  });
  // unify cols within clusters
  evs.forEach(e=>{
    const s=toMin(e.time);let en=toMin(e.end);if(en==null||en<=s)en=s+45;
    let m=cols[e.id];
    evs.forEach(o=>{const os=toMin(o.time);let oe=toMin(o.end);if(oe==null||oe<=os)oe=os+45;
      if(os<en&&oe>s)m=Math.max(m,cols[o.id]);});
    cols[e.id]=m;
  });
  return {lane,cols};
}

function parseClientLine(line){
  let s=line.trim();if(!s)return null;
  // formats: "#43 | Name", "43 | Name", "43 - Name", "43. Name", "43 Name", "Name"
  let m=s.match(/^#?\s*(\d+)\s*[|\-–—.:)]\s*(.+)$/)||s.match(/^#?\s*(\d+)\s+(.+)$/);
  if(m)return{code:m[1],name:m[2].trim()};
  return{code:'',name:s.replace(/^#/,'').trim()};
}

/* soma investido/conversas/vendas de um cliente num intervalo (pro relatório) */
function aggClientRange(code,fromISO,toISO){const raw=code?painelMap()[String(code)]:null;if(!raw)return null;
  const ok=d=>d&&d>=fromISO&&d<=toISO;let inv=0,conv=0,vendas=0,fat=0;
  (Array.isArray(raw.semanas)?raw.semanas:[]).forEach(w=>{if(ok(w.d)){inv+=Number(w.inv)||0;conv+=Number(w.conv)||0;}});
  (Array.isArray(raw.vendas)?raw.vendas:[]).forEach(s=>{if(ok(s.d)){vendas++;fat+=Number(s.v)||0;}});
  return {investido:inv,conversas:conv,vendas:vendas,faturamento:fat};}
function buildWeekReport(cid){
  if(!cid)return 'Escolha um cliente.';
  const s=startOfWeek(new Date()),e=new Date(s);e.setDate(s.getDate()+6);
  const from=iso(s),to=iso(e);
  const done=state.events.filter(ev=>ev.clientId===cid&&ev.done&&ev.date>=from&&ev.date<=to).sort((a,b)=>a.date.localeCompare(b.date));
  let out=`📊 *FLOOW Digital* — ${clientName(cid)}\n📅 Resumo da semana (${pad(s.getDate())}/${pad(s.getMonth()+1)} a ${pad(e.getDate())}/${pad(e.getMonth()+1)})\n`;
  out+=`\n✅ *O que fizemos essa semana:*\n`;
  if(done.length)done.forEach(ev=>{out+=`• ${typeOf(ev.type).em} ${ev.title}${ev.obs?` — ${ev.obs}`:''}\n`;});
  else out+=`• _(nenhuma tarefa concluída registrada essa semana)_\n`;
  const c=clientById(cid),m=c?aggClientRange(c.code,from,to):null;
  if(m&&(m.investido||m.conversas||m.vendas)){
    out+=`\n📈 *Resultados:*\n`;
    if(m.investido)out+=`• Investimento: ${fmtBRL(m.investido)}\n`;
    out+=`• Conversas iniciadas: ${m.conversas}\n`;
    if(m.vendas)out+=`• Vendas: ${m.vendas}\n`;
  }
  out+=`\n_Qualquer dúvida, estamos à disposição! 🚀_`;
  return out.trim();
}

function buildCopyText(){
  const cid=$('#copyClient').value;if(!cid)return 'Cadastre uma entrega primeiro.';
  const evs=state.events.filter(e=>e.clientId===cid).sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));
  if(!evs.length)return 'Esse cliente ainda não tem tarefas.';
  const mset=[...new Set(evs.map(e=>parseISO(e.date).getMonth()))];
  const monthLabel=mset.length===1?MONTHS[mset[0]]:'agenda';
  let out=`📅 Agenda *${clientName(cid)}* — ${monthLabel}\n`;
  evs.forEach(ev=>{
    const d=parseISO(ev.date);
    const datePart=`${DOW[d.getDay()]} (${pad(d.getDate())}/${pad(d.getMonth()+1)}/${String(d.getFullYear()).slice(2)})`;
    const timePart=ev.time?(ev.end?` das ${ev.time} às ${ev.end}`:` às ${ev.time}`):'';
    const head=`*${typeOf(ev.type).em} ${ev.title}*`;
    const line=`${datePart}${timePart}`;
    if(ev.done){out+=`\n~${head}~\n~${line} feito ✅~${ev.loc?`\n${ev.loc}`:''}\n`;}
    else{out+=`\n${head}\n${line}${ev.loc?`\n${ev.loc}`:''}\n`;}
  });
  return out.trim();
}

async function loadPainel(){
  if(painelLoading)return; painelLoading=true;
  try{const r=await window.storage.get('floow-painel',true);painelCache=(r&&r.value)?JSON.parse(r.value):{clientes:[]};}
  catch(e){painelCache={clientes:[]};}
  painelLoaded=true;painelLoading=false;
  if(currentUser)render(); // re-renderiza pra Painel/Otimizações/Resultados já mostrarem a situação
}
function painelMap(){const m={};((painelCache&&painelCache.clientes)||[]).forEach(c=>{if(c.code)m[String(c.code)]=c;});return m;}
function painelRange(){
  const today=new Date();
  if(painelPeriod==='mes'){const s=new Date(today.getFullYear(),today.getMonth(),1),e=new Date(today.getFullYear(),today.getMonth()+1,0);return {from:iso(s),to:iso(e)};}
  if(painelPeriod==='semana'){const s=startOfWeek(today),e=new Date(s);e.setDate(s.getDate()+6);return {from:iso(s),to:iso(e)};}
  if(painelPeriod==='custom'&&painelFrom&&painelTo)return {from:painelFrom,to:painelTo};
  return null; // total
}
function aggClient(raw){ // soma investido/conversas (semanas) e vendas/faturamento (vendas) no período
  const r=painelRange(), ok=d=>!r||(d&&d>=r.from&&d<=r.to);
  let inv=0,conv=0,vendas=0,fat=0;
  const sem=(raw&&Array.isArray(raw.semanas))?raw.semanas:[];
  const vds=(raw&&Array.isArray(raw.vendas))?raw.vendas:[];
  sem.forEach(w=>{if(ok(w.d)){inv+=Number(w.inv)||0;conv+=Number(w.conv)||0;}});
  vds.forEach(s=>{if(ok(s.d)){vendas++;fat+=Number(s.v)||0;}});
  return {investido:inv,conversas:conv,vendas:vendas,faturamento:fat};
}
function metricsFor(code){const raw=code?painelMap()[String(code)]:null;return raw?aggClient(raw):null;}
function setPainelPeriod(p){painelPeriod=p;renderResultadosInner();}
function setPainelCustom(){painelFrom=$('#pFrom').value;painelTo=$('#pTo').value;if(painelFrom&&painelTo)renderResultadosInner();}
function painelPeriodLabel(){const r=painelRange();if(!r)return 'mostrando o total acumulado';return `mostrando ${r.from.split('-').reverse().join('/')} até ${r.to.split('-').reverse().join('/')}`;}
function resultCfg(){return {
  lucroExc:Number(state.painelLucroExc)||2,                                  // lucro ≥ 2× investido = Excelente
  lucroBom:Number(state.painelLucroBom)||1.2,                                // lucro ≥ 1,2× investido = Bom
  lucroObs:Number(state.painelLucroObs)||0.8,                                // lucro ≥ 0,8× investido = Observação (empate)
  custoBom:(state.painelCustoBom!=null?Number(state.painelCustoBom):1.0),    // conversa abaixo disso = boa
  custoCaro:(state.painelCustoCaro!=null?Number(state.painelCustoCaro):1.5), // conversa acima disso = cara
  margem:(state.painelMargem!=null?Number(state.painelMargem):20)            // lucro = faturamento × margem%
};}
function resultAuto(m,cfg){
  if(!m)return 'sem';
  const inv=Number(m.investido)||0,fat=Number(m.faturamento)||0,conv=Number(m.conversas)||0;
  if(inv<=0&&fat<=0&&conv<=0)return 'sem';      // sem dados
  if(fat<=0)return 'ruim';                       // não vendeu
  const lucro=fat*(cfg.margem/100);
  if(inv<=0)return 'excelente';                  // vendeu sem gastar em anúncio
  const r=lucro/inv;                             // quantas vezes o lucro cobre o investido
  if(r>=cfg.lucroExc)return 'excelente';
  if(r>=cfg.lucroBom)return 'bom';
  if(r>=cfg.lucroObs)return 'observacao';
  return 'ruim';                                 // lucro < investido = prejuízo
}
function custoNivel(custo,cfg){
  if(custo==null)return {label:'',color:'var(--txt)'};
  if(custo<cfg.custoBom)return {label:'bom',color:'#36d399'};
  if(custo>cfg.custoCaro)return {label:'caro',color:'#f2675c'};
  return {label:'médio',color:'#f5b400'};
}
function resultFinal(c,m,cfg){return (c.resultStatus&&c.resultStatus!=='auto')?c.resultStatus:resultAuto(m,cfg);}
function clientSituacao(c){if(!c)return 'sem';return resultFinal(c,metricsFor(c.code),resultCfg());} // situação do cliente = diagnóstico da aba Resultados (no período selecionado)

/* ---------- integração com o Google Agenda ---------- */
const GCAL_SCOPE='https://www.googleapis.com/auth/drive https://www.googleapis.com/auth/calendar.events'; // Drive (pastas) + Agenda
const GCAL_TZ='America/Sao_Paulo';
let gAccessToken=null, gTokenClient=null, gTokenExpiry=0, gPendingAfterAuth=null;
function googleClientId(){return window.GOOGLE_CLIENT_ID||'';}
function googleLibReady(){return typeof google!=='undefined'&&google.accounts&&google.accounts.oauth2;}
function gConnectedFlag(){return localStorage.getItem('floow-gcal-connected')==='1';}
function gInitTokenClient(){
  if(gTokenClient||!googleLibReady()||!googleClientId())return gTokenClient;
  gTokenClient=google.accounts.oauth2.initTokenClient({
    client_id:googleClientId(),
    scope:GCAL_SCOPE,
    callback:resp=>{
      if(resp&&resp.access_token){
        gAccessToken=resp.access_token;
        gTokenExpiry=Date.now()+((resp.expires_in?resp.expires_in*1000:3300000)-60000);
        localStorage.setItem('floow-gcal-connected','1');
        renderUserChip();const g=$('#gcalCfg');if(g)renderGcalConfig();
        if(gPendingAfterAuth){const f=gPendingAfterAuth;gPendingAfterAuth=null;f();}
        else toast('📅 Google Agenda conectado');
      }
    }
  });
  return gTokenClient;
}
function connectGoogle(){
  if(!googleClientId()){toast('⚠️ Falta configurar o Google (client ID). Veja GOOGLE.md');return;}
  if(!googleLibReady()){toast('Carregando o Google… tente de novo em alguns segundos');return;}
  gInitTokenClient();
  gTokenClient.requestAccessToken({prompt:gConnectedFlag()?'':'consent'});
}
function gEnsureToken(cb){
  if(gAccessToken&&Date.now()<gTokenExpiry){cb();return;}
  if(!googleClientId()||!googleLibReady())return;
  gInitTokenClient();gPendingAfterAuth=cb;
  gTokenClient.requestAccessToken({prompt:''});
}
function shouldSyncGoogle(ev){
  if(!ev||!gConnectedFlag())return false;
  const u=userById(ev.resp);
  return !!(u&&u.googleSync);
}
function gcalPayload(ev,withMeet){
  const body={
    summary:`${typeOf(ev.type).em} ${ev.title} · ${clientName(ev.clientId)}`,
    description:`FLOOW Gestão\nResponsável: ${respName(ev.resp)}`,
    colorId:'3' // roxo ("Uva") no Google Agenda
  };
  if(withMeet)body.conferenceData={createRequest:{requestId:'floow-'+ev.id,conferenceSolutionKey:{type:'hangoutsMeet'}}};
  if(ev.time){
    const end=ev.end||addMinHHMM(ev.time,60);
    body.start={dateTime:`${ev.date}T${ev.time}:00`,timeZone:GCAL_TZ};
    body.end={dateTime:`${ev.date}T${end}:00`,timeZone:GCAL_TZ};
  }else{
    body.start={date:ev.date};body.end={date:nextDay(ev.date)};
  }
  return body; // sem convidados: vai DIRETO no calendário do responsável
}
function syncEventToGoogle(ev){
  if(!shouldSyncGoogle(ev))return;
  const u=userById(ev.resp);
  if(!u||!u.email||!/@/.test(u.email))return; // o e-mail do responsável É o calendário de destino
  const cal=u.email;
  gEnsureToken(()=>{
    // se o responsável mudou, apaga do calendário antigo antes de recriar
    if(ev.gcalId&&ev.gcalCal&&ev.gcalCal!==cal){
      fetch('https://www.googleapis.com/calendar/v3/calendars/'+encodeURIComponent(ev.gcalCal)+'/events/'+encodeURIComponent(ev.gcalId),{method:'DELETE',headers:{'Authorization':'Bearer '+gAccessToken}}).catch(()=>{});
      ev.gcalId=null;
    }
    const isUpdate=!!ev.gcalId;
    const withMeet=typeIsOnline(ev.type)&&!ev.meetLink; // gera Meet só se for reunião online e ainda sem link
    const base='https://www.googleapis.com/calendar/v3/calendars/'+encodeURIComponent(cal)+'/events';
    const url=base+(isUpdate?'/'+encodeURIComponent(ev.gcalId):'')+(withMeet?'?conferenceDataVersion=1':'');
    fetch(url,{method:isUpdate?'PATCH':'POST',headers:{'Authorization':'Bearer '+gAccessToken,'Content-Type':'application/json'},body:JSON.stringify(gcalPayload(ev,withMeet))})
      .then(r=>r.json()).then(data=>{
        if(data&&data.error){console.warn('gcal',data.error);toast('⚠️ Agenda ('+cal+'): '+(data.error.message||'falha'));return;}
        if(data&&data.id){ev.gcalId=data.id;ev.gcalCal=cal;}
        if(data&&data.hangoutLink&&!ev.meetLink)ev.meetLink=data.hangoutLink;
        if(data&&data.id)saveData();
        toast('📅 Na agenda de '+respName(ev.resp)+(ev.meetLink?' · Meet 🔗':''));
      }).catch(e=>{console.warn('gcal',e);toast('Falha ao sincronizar na agenda');});
  });
}
function deleteGoogleEvent(ev){
  if(!ev||!ev.gcalId||!gConnectedFlag())return;
  const cal=ev.gcalCal||'primary';
  gEnsureToken(()=>{
    fetch('https://www.googleapis.com/calendar/v3/calendars/'+encodeURIComponent(cal)+'/events/'+encodeURIComponent(ev.gcalId),{method:'DELETE',headers:{'Authorization':'Bearer '+gAccessToken}}).catch(()=>{});
  });
}

/* ---------- Google Drive: criar pastas do cliente (com níveis) ---------- */
let driveDraft=null;
const DEFAULT_DRIVE_TREE=`Criativos assertivos
  Roteiro de criativos
  Referências Modelo
  Material Bruto
  Identidade visual
  Criativos prontos
  Concorrentes
  Brief dos criativos
Otimização comercial
Gestão de mídias pagas
Estruturação estratégica
Administrativo`;
function driveFolderId(urlOrId){if(!urlOrId)return '';const m=String(urlOrId).match(/[-\w]{25,}/);return m?m[0]:String(urlOrId).trim();}
function driveCreateFolder(name,parentId){
  const body={name:name,mimeType:'application/vnd.google-apps.folder'};
  if(parentId)body.parents=[parentId];
  return fetch('https://www.googleapis.com/drive/v3/files?fields=id,webViewLink',{
    method:'POST',headers:{'Authorization':'Bearer '+gAccessToken,'Content-Type':'application/json'},body:JSON.stringify(body)
  }).then(r=>r.json());
}
function parseDriveTree(text){
  const lines=String(text||'').split('\n').filter(l=>l.trim());
  const root=[];const stack=[{depth:-1,children:root}];
  for(const raw of lines){
    const lead=(raw.match(/^[\t ]*/)||[''])[0].replace(/\t/g,'  ');
    const depth=Math.floor(lead.length/2);
    const node={name:raw.trim(),children:[]};
    while(stack.length>1&&stack[stack.length-1].depth>=depth)stack.pop();
    stack[stack.length-1].children.push(node);
    stack.push({depth,children:node.children});
  }
  return root;
}
function driveShareFolder(fileId,email){
  return fetch('https://www.googleapis.com/drive/v3/files/'+fileId+'/permissions?sendNotificationEmail=false&fields=id',{
    method:'POST',headers:{'Authorization':'Bearer '+gAccessToken,'Content-Type':'application/json'},
    body:JSON.stringify({role:'writer',type:'user',emailAddress:email})
  }).then(r=>r.json());
}
function driveCopyFile(fileId,name,parentId){
  return fetch('https://www.googleapis.com/drive/v3/files/'+fileId+'/copy?fields=id,webViewLink&supportsAllDrives=true',{
    method:'POST',headers:{'Authorization':'Bearer '+gAccessToken,'Content-Type':'application/json'},
    body:JSON.stringify({name:name,parents:[parentId]})
  }).then(r=>r.json());
}
function fillTemplateName(pat,c){return String(pat||'').replace(/\{cod\}/gi,c.code||'').replace(/\{nome\}/gi,c.name||'').replace(/\{cliente\}/gi,c.name||'').trim();}
async function driveCreateTree(nodes,parentId,prefix,map){
  const shares=state.driveShares||[]; // regras: {folder, emails:[...]}
  for(const n of nodes){
    const f=await driveCreateFolder((prefix||'')+n.name,parentId);
    if(f&&f.id){
      if(prefix&&map)map[n.name.trim().toLowerCase()]=f.id; // pastas de 1º nível (por nome) p/ modelos
      // subpastas de 1º nível (com prefixo): compartilha com os e-mails das regras que casam o nome
      if(prefix){
        const emails=[];shares.forEach(r=>{if(r&&r.folder===n.name)(r.emails||[]).forEach(e=>emails.push(e));});
        for(const em of emails){if(em&&em.trim()){
          try{const res=await driveShareFolder(f.id,em.trim());
            if(res&&res.error)toast('⚠️ Não deu acesso a '+em+': '+(res.error.message||'erro'));
            else toast('🤝 Acesso de '+n.name+' → '+em);
          }catch(e){console.warn('share',e);}
        }}
      }
      if(n.children&&n.children.length)await driveCreateTree(n.children,f.id,'',null); // níveis internos sem prefixo
    }
  }
}
function createClientDriveFolders(client){
  if(!client||!gConnectedFlag()||!state.driveRoot)return; // só se conectado e com pasta raiz definida
  if(client.driveUrl)return; // já tem pasta
  gEnsureToken(async()=>{
    try{
      const root=driveFolderId(state.driveRoot);
      const pref=client.code?('#'+client.code+' | '):'';
      const folder=await driveCreateFolder(pref+client.name,root); // pasta do cliente: "#cód | Nome"
      if(!folder||!folder.id){toast('⚠️ Não consegui criar a pasta no Drive (permissão de Editor?)');return;}
      client.driveUrl=folder.webViewLink||('https://drive.google.com/drive/folders/'+folder.id);
      touch(client);saveData();
      if(openClientId===client.id&&$('#clDrive'))$('#clDrive').value=client.driveUrl;
      if(tab==='clients')renderClientGrid();
      toast('📁 Criando pastas de '+client.name+'…');
      const tree=parseDriveTree(state.driveTree||'');
      const folderMap={};
      await driveCreateTree(tree,folder.id,pref,folderMap); // subpastas de 1º nível levam o prefixo "#cód | "
      // duplica os modelos (planilha comercial, docs roadmap) e renomeia
      const templates=state.driveTemplates||[];
      for(const tpl of templates){
        if(!tpl||!tpl.fileId)continue;
        const target=folderMap[(tpl.subfolder||'').trim().toLowerCase()];
        if(!target){toast('⚠️ Pasta "'+(tpl.subfolder||'')+'" não encontrada p/ o modelo');continue;}
        const nm=fillTemplateName(tpl.name,client);
        try{const res=await driveCopyFile(driveFolderId(tpl.fileId),nm,target);
          if(res&&res.error)toast('⚠️ Não dupliquei "'+nm+'": '+(res.error.message||'erro'));
          else toast('📄 Modelo criado: '+nm);
        }catch(e){console.warn('copy',e);}
      }
      toast('✅ Pastas e modelos criados: '+client.name);
    }catch(e){console.warn('drive',e);toast('⚠️ Falha ao criar pasta no Drive');}
  });
}

/* ---------- notificações: avisar 20 min antes de cada tarefa ---------- */
const NOTIFY_LEAD=20; // minutos de antecedência
let notifyTimer=null, notifyReady=false;
function notifyKey(ev){return 'floow-notified:'+ev.date+':'+ev.id;}
function cleanNotifyKeys(){
  try{const today=iso(new Date());for(let i=localStorage.length-1;i>=0;i--){const k=localStorage.key(i);if(!k)continue;
    const isNotif=k.indexOf('floow-notified:')===0||k.indexOf('floow-started:')===0;
    if(isNotif&&k.indexOf(':'+today+':')===-1)localStorage.removeItem(k);
  }}catch(e){}
}
function setupNotifications(){
  if(!('Notification' in window))return;
  cleanNotifyKeys();
  if(notifyTimer)clearInterval(notifyTimer);
  checkUpcomingNotifications();
  notifyTimer=setInterval(checkUpcomingNotifications,30000); // checa a cada 30s
}
function requestNotifyPermission(){
  if(!('Notification' in window)){toast('Este navegador não suporta avisos');return;}
  if(Notification.permission==='granted'){toast('🔔 Avisos já ativados');setupNotifications();return;}
  Notification.requestPermission().then(p=>{
    renderUserChip();
    if(p==='granted'){toast('🔔 Avisos ativados');setupNotifications();}
    else toast('Avisos bloqueados — libere nas permissões do site');
  }).catch(()=>{});
}
function fireNotif(title,ev,tagSuffix){
  try{new Notification(title,{
    body:`${typeOf(ev.type).em} ${ev.title} · ${clientName(ev.clientId)}`+(fmtRange(ev)?'\n'+fmtRange(ev):''),
    icon:'/icon.svg',tag:ev.id+(tagSuffix||'')
  });}catch(e){}
}
function checkBillingNotifications(){
  // avisa o admin 1 dia antes do dia de cobrança de cada cliente ativo
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  if(!currentUser||!isAdmin()||!state||!state.clients)return;
  const now=new Date();const tmr=new Date(now);tmr.setDate(now.getDate()+1);
  const tDay=tmr.getDate();const ym=tmr.getFullYear()+'-'+pad(tmr.getMonth()+1);
  state.clients.forEach(c=>{
    if(c.status!=='ativo')return;
    const bd=parseInt(c.billingDay);if(!bd||bd!==tDay)return;
    const key='floow-billing:'+ym+':'+c.id;
    if(localStorage.getItem(key))return;localStorage.setItem(key,'1');
    try{new Notification('💰 Cobrança amanhã',{
      body:`${c.code?'#'+c.code+' ':''}${c.name}`+(c.contractValue?` · ${fmtBRL(c.contractValue)}`:'')+`\nVence no dia ${bd}`,
      icon:'/icon.svg',tag:'billing-'+c.id
    });}catch(e){}
  });
}
function checkUpcomingNotifications(){
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  if(!currentUser||!state)return;
  checkBillingNotifications();
  if(!state.events)return;
  const now=new Date();const todayIso=iso(now);const nowMin=now.getHours()*60+now.getMinutes();
  state.events.forEach(ev=>{
    if(ev.done||ev.resp!==currentUser.id||ev.date!==todayIso)return;
    const s=toMin(ev.time);if(s==null)return;
    const diff=s-nowMin;
    // 1) aviso de antecedência: de 20 min até 1 min antes
    if(diff>=1&&diff<=NOTIFY_LEAD){
      const key='floow-notified:'+ev.date+':'+ev.id;
      if(!localStorage.getItem(key)){localStorage.setItem(key,'1');fireNotif('⏰ Tarefa em '+diff+' min',ev,'-pre');}
    }
    // 2) aviso na hora de iniciar: do horário até 2 min depois (tolerância)
    if(diff<=0&&diff>=-2){
      const key='floow-started:'+ev.date+':'+ev.id;
      if(!localStorage.getItem(key)){localStorage.setItem(key,'1');fireNotif('▶️ Hora de começar',ev,'-start');}
    }
  });
}

let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2200);}
document.querySelectorAll('.scrim').forEach(s=>s.addEventListener('click',e=>{if(e.target===s)s.classList.remove('on');}));

(async()=>{
  try{ if(window.__storageReady) await window.__storageReady; }catch(e){}
  await load();render();
})();
