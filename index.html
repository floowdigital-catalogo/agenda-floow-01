<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5b400">
<title>FLOOW Digital — Agenda de Entregas</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0a0a0b; --ink-2:#121212; --surface:#181818; --surface-2:#202020;
    --line:#2c2c2d; --line-soft:#232323;
    --txt:#f4f2ec; --txt-dim:#a7a39a; --txt-faint:#6f6c64;
    --brand:#f5b400; --brand-2:#ffce3a; --brand-deep:#3a2c00; --on-brand:#1c1500;
    --danger:#f2675c; --ok:#36d399;
    --radius:14px; --shadow:0 18px 50px -20px rgba(0,0,0,.8);
    font-family:'Onest',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--ink);color:var(--txt)}
  body{min-height:100vh;
    background:
      radial-gradient(900px 520px at 88% -10%, rgba(245,180,0,.13), transparent 60%),
      radial-gradient(680px 480px at -6% 112%, rgba(245,180,0,.05), transparent 55%),
      var(--ink);
    padding:22px clamp(12px,3vw,34px) 80px;}
  h1,h2,h3{font-family:'Bricolage Grotesque',sans-serif;letter-spacing:-.02em}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  ::-webkit-scrollbar{height:9px;width:9px}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:20px}

  header.app{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
  .brand{display:flex;align-items:center;gap:13px}
  .mark{width:50px;height:50px;border-radius:50%;flex:none;
    background:radial-gradient(circle at 50% 38%,#1d1d1d,#0c0c0c);border:1px solid #2e2a1c;
    display:grid;place-items:center;
    box-shadow:0 8px 26px -10px rgba(245,180,0,.55), inset 0 0 0 1px rgba(245,180,0,.08);}
  .mark svg{width:30px;height:auto;display:block}
  .brand .name{font-size:25px;font-weight:800;line-height:1;letter-spacing:.01em}
  .brand .name b{color:var(--brand)}
  .brand .sub{font-size:12px;color:var(--txt-dim);margin-top:3px;letter-spacing:.06em;text-transform:uppercase}
  .user-chip{display:flex;align-items:center;gap:9px;background:var(--ink-2);border:1px solid var(--line-soft);border-radius:30px;padding:5px 6px 5px 13px}
  .uc-dot{width:11px;height:11px;border-radius:50%;flex:none}
  .uc-name{font-size:13.5px;font-weight:700}
  .uc-role{font-size:11px;color:var(--txt-faint);text-transform:uppercase;letter-spacing:.04em}
  .uc-btn{background:var(--surface);border:1px solid var(--line);color:var(--txt-dim);border-radius:20px;padding:6px 11px;font-size:12.5px;font-weight:600}
  .uc-btn:hover{color:var(--txt);border-color:var(--txt-faint)}
  .mine-badge{font-size:13px;font-weight:700;color:var(--brand);background:var(--brand-deep);border:1px solid color-mix(in srgb,var(--brand) 40%,transparent);padding:8px 14px;border-radius:9px}
  /* login */
  .login{display:grid;place-items:center;min-height:64vh;padding:20px}
  .login-card{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:30px 26px;box-shadow:var(--shadow);text-align:center}
  .mark.big{width:64px;height:64px;margin:0 auto 14px}
  .mark.big svg{width:40px}
  .login-card h2{font-size:22px;margin:0 0 2px}
  .login-card .login-sub{font-size:12.5px;color:var(--txt-dim);margin:0 0 18px;letter-spacing:.04em;text-transform:uppercase}
  .login-card label.f{text-align:left}
  /* users modal */
  .urow{background:var(--ink-2);border:1px solid var(--line);border-radius:11px;padding:11px;margin-bottom:9px}
  .urow-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .urow-top .uname{flex:1;font-weight:700}
  .uadmin{display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:var(--txt-dim);white-space:nowrap}
  .uadmin input{accent-color:var(--brand);width:16px;height:16px}
  .urow-grid{display:grid;grid-template-columns:1.4fr 1fr 1.2fr;gap:8px}
  @media(max-width:560px){.urow-grid{grid-template-columns:1fr}}

  /* config tab */
  .cfg-card{background:var(--ink-2);border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:10px}
  .cfg-top{display:flex;align-items:center;gap:10px;margin-bottom:9px}
  .cfg-top .uname{flex:1;font-weight:700;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;color:var(--txt);font-family:inherit;font-size:14px}
  .cfg-grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:8px;margin-bottom:11px}
  @media(max-width:560px){.cfg-grid2{grid-template-columns:1fr}}
  .cfg-dem-lbl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--txt-faint);margin-bottom:7px}
  .cfg-dems{display:flex;flex-wrap:wrap;gap:7px}
  .dembtn{border:1px solid var(--line);background:var(--surface);color:var(--txt-dim);border-radius:20px;padding:6px 12px;font-size:12px;font-weight:600;transition:.13s}
  .dembtn:hover{border-color:var(--txt-faint);color:var(--txt)}
  .dembtn.on{border-color:var(--brand);background:var(--brand-deep);color:var(--txt)}
  .cfg-sec-h{font-family:'Bricolage Grotesque';font-weight:700;font-size:16px;margin:26px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line-soft)}
  .cfg-sec-h:first-child{margin-top:4px}
  .cfg-side{float:right;font-family:'Onest';font-weight:500;font-size:11px;color:var(--txt-faint);max-width:55%;text-align:right}
  .cfg-add{width:100%;justify-content:center;margin-top:2px}
  .cfg-card .emoji{flex:none;width:48px;text-align:center;font-size:16px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 0;color:var(--txt);font-family:inherit}
  .cfg-link{display:flex;align-items:center;gap:9px}
  .cfg-link-lbl{font-size:11.5px;color:var(--txt-faint);flex:none}
  .cfg-link select{flex:1}
  .cfg-row{display:flex;align-items:center;gap:10px}
  .cfg-row .uname{flex:1}

  .tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--line-soft);padding-bottom:0}
  .tab{padding:10px 16px;font-size:14px;font-weight:700;color:var(--txt-faint);border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:7px}
  .tab.on{color:var(--txt);border-color:var(--brand)}
  .tab .badge{background:var(--surface-2);color:var(--txt-dim);font-size:11px;font-weight:700;padding:1px 7px;border-radius:20px}

  .toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--ink-2);border:1px solid var(--line-soft);border-radius:var(--radius);padding:11px 13px;margin-bottom:16px}
  .nav{display:flex;align-items:center;gap:4px}
  .nav button.arrow{width:34px;height:34px;border-radius:9px;background:var(--surface);border:1px solid var(--line);font-size:17px;color:var(--txt-dim);display:grid;place-items:center;transition:.15s}
  .nav button.arrow:hover{color:var(--brand);border-color:var(--brand)}
  .period{font-family:'Bricolage Grotesque';font-weight:700;font-size:19px;min-width:150px;text-align:center;text-transform:capitalize}
  .btn{border:1px solid var(--line);background:var(--surface);padding:8px 13px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--txt-dim);transition:.15s;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
  .btn:hover{color:var(--txt);border-color:var(--txt-faint)}
  .btn.ghost{background:transparent}
  .btn.primary{background:var(--brand);color:var(--on-brand);border-color:var(--brand);font-weight:700}
  .btn.primary:hover{filter:brightness(1.06);color:var(--on-brand)}
  .btn.on{border-color:var(--brand);color:var(--brand)}
  .seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .seg button{padding:8px 14px;font-size:13px;font-weight:600;color:var(--txt-dim)}
  .seg button.on{background:var(--surface-2);color:var(--txt)}
  .spacer{flex:1 1 30px}
  select.filter,input.search{background:var(--surface);border:1px solid var(--line);color:var(--txt);padding:8px 11px;border-radius:9px;font-size:13px;font-family:inherit}
  select.filter{max-width:180px}

  .legend{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;font-size:12.5px;color:var(--txt-dim)}
  .legend .chip{display:inline-flex;align-items:center;gap:6px;background:var(--ink-2);border:1px solid var(--line-soft);padding:4px 10px 4px 8px;border-radius:30px}
  .legend .dot{width:11px;height:11px;border-radius:50%;flex:none}

  .grid-head{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-bottom:7px}
  .grid-head div{font-size:11.5px;font-weight:600;color:var(--txt-faint);text-transform:uppercase;letter-spacing:.08em;padding-left:4px}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
  .cell{background:var(--ink-2);border:1px solid var(--line-soft);border-radius:11px;min-height:116px;padding:7px;display:flex;flex-direction:column;gap:4px;transition:.12s;cursor:pointer;overflow:hidden}
  .cell:hover{border-color:var(--line)}
  .cell.dim{opacity:.42}
  .cell.today{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
  .cell .dnum{font-size:12.5px;font-weight:600;color:var(--txt-dim);align-self:flex-start;padding:1px 2px}
  .cell.today .dnum{color:var(--brand)}
  .ev{border-radius:7px;padding:4px 7px;font-size:11.7px;font-weight:600;line-height:1.25;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 16%, transparent);color:var(--txt);display:flex;gap:5px;align-items:baseline;transition:.12s}
  .ev:hover{background:color-mix(in srgb,var(--c) 26%, transparent)}
  .ev .ti{font-size:10px;opacity:.8;font-weight:700;flex:none}
  .ev .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ev.done{opacity:.55}
  .ev.done .tx{text-decoration:line-through}
  .more{font-size:10.5px;color:var(--txt-faint);padding-left:4px}

  .week{display:flex;flex-direction:column;gap:9px}
  .wday{background:var(--ink-2);border:1px solid var(--line-soft);border-radius:12px;padding:13px 15px;display:flex;gap:16px;cursor:pointer;transition:.12s}
  .wday:hover{border-color:var(--line)}
  .wday.today{border-color:var(--brand)}
  .wday .wd-date{flex:none;width:62px}
  .wday .wd-dow{font-size:11.5px;color:var(--txt-faint);text-transform:uppercase;letter-spacing:.06em}
  .wday .wd-num{font-family:'Bricolage Grotesque';font-weight:700;font-size:26px;line-height:1.1}
  .wday.today .wd-num{color:var(--brand)}
  .wday .wd-evs{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
  .wday .empty{color:var(--txt-faint);font-size:13px;align-self:center}
  .wrow{display:flex;gap:9px;align-items:center;padding:7px 10px;border-radius:9px;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 13%, transparent);font-size:13.5px;transition:.12s}
  .wrow:hover{background:color-mix(in srgb,var(--c) 22%, transparent)}
  .wrow.done .wr-title{text-decoration:line-through;opacity:.6}
  .wrow .wr-time{font-size:12px;font-weight:700;color:var(--c);flex:none;width:52px}
  .wrow .wr-title{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;background:var(--surface-2);color:var(--txt-dim);flex:none}

  /* clients tab */
  .clients-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .clients-bar .search{flex:1;min-width:160px}
  .quickadd{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .quickadd input{background:transparent;border:none;color:var(--txt);font-family:inherit;font-size:13px;padding:8px 11px;width:180px}
  .quickadd input:focus{outline:none}
  .quickadd button{background:var(--brand);color:var(--on-brand);font-weight:700;font-size:13px;padding:8px 13px;white-space:nowrap}
  .quickadd button:hover{filter:brightness(1.06)}
  .ccode{font-size:11px;font-weight:700;color:var(--txt-faint);background:var(--surface-2);padding:1px 6px;border-radius:6px;flex:none}
  .cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:11px}
  .ccard{background:var(--ink-2);border:1px solid var(--line-soft);border-radius:13px;padding:14px 15px;cursor:pointer;transition:.13s;display:flex;flex-direction:column;gap:9px}
  .ccard:hover{border-color:var(--brand);transform:translateY(-1px)}
  .ccard .ctop{display:flex;align-items:center;gap:9px}
  .ccard .cdot{width:10px;height:10px;border-radius:50%;flex:none}
  .ccard .cname{font-family:'Bricolage Grotesque';font-weight:700;font-size:16.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ccard .cstat{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.04em}
  .cstat.ativo{background:rgba(54,211,153,.15);color:var(--ok)}
  .cstat.pausado{background:rgba(245,180,0,.15);color:var(--brand)}
  .cstat.arquivado{background:var(--surface-2);color:var(--txt-faint)}
  .hbadge{font-size:10px;font-weight:800;padding:3px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.04em;flex:none;color:var(--h);background:color-mix(in srgb,var(--h) 18%,transparent);border:1px solid color-mix(in srgb,var(--h) 40%,transparent)}
  .ccard .cmeta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--txt-dim)}
  .ccard .cmeta b{color:var(--txt)}
  .ccard .cnext{font-size:12px;color:var(--txt-faint);border-top:1px solid var(--line-soft);padding-top:8px}
  .ccard .cnext b{color:var(--txt-dim);font-weight:600}
  .empty-state{text-align:center;color:var(--txt-faint);padding:50px 20px;font-size:14px}

  /* client detail / timeline */
  .timeline{display:flex;flex-direction:column;gap:8px;margin-top:6px}
  .tl{display:flex;gap:11px;align-items:flex-start;padding:10px 12px;border-radius:10px;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);cursor:pointer;transition:.12s}
  .tl:hover{background:color-mix(in srgb,var(--c) 20%,transparent)}
  .tl .tl-d{flex:none;width:54px;text-align:center}
  .tl .tl-day{font-family:'Bricolage Grotesque';font-weight:700;font-size:18px;line-height:1}
  .tl .tl-mo{font-size:10px;color:var(--txt-faint);text-transform:uppercase}
  .tl .tl-body{flex:1;min-width:0}
  .tl .tl-t{font-weight:600;font-size:13.5px}
  .tl.done .tl-t{text-decoration:line-through;opacity:.6}
  .tl .tl-sub{font-size:11.5px;color:var(--txt-dim);margin-top:2px}

  .scrim{position:fixed;inset:0;background:rgba(4,4,5,.72);backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;padding:36px 16px;z-index:50;overflow:auto}
  .scrim.on{display:flex}
  .modal{background:var(--surface);border:1px solid var(--line);border-radius:18px;width:100%;max-width:440px;box-shadow:var(--shadow);padding:22px;animation:pop .18s ease}
  .modal.wide{max-width:560px}
  @keyframes pop{from{transform:translateY(8px) scale(.98);opacity:0}to{transform:none;opacity:1}}
  .modal h2{font-size:20px;margin:0 0 16px}
  .modal h2 .x{float:right;color:var(--txt-faint);font-size:22px;line-height:1;cursor:pointer}
  .modal h2 .x:hover{color:var(--txt)}
  .modal h2 small{display:block;font-family:'Onest';font-size:12px;font-weight:500;color:var(--txt-dim);margin-top:3px;letter-spacing:0}
  label.f{display:block;font-size:12px;font-weight:600;color:var(--txt-dim);margin:13px 0 5px;text-transform:uppercase;letter-spacing:.04em}
  input.t,select.t,textarea.t{width:100%;background:var(--ink-2);border:1px solid var(--line);border-radius:9px;padding:10px 11px;color:var(--txt);font-family:inherit;font-size:14px}
  input.t:focus,select.t:focus,textarea.t:focus{outline:none;border-color:var(--brand)}
  .two{display:flex;gap:10px}.two>div{flex:1}
  .typegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
  .typebtn{border:1px solid var(--line);background:var(--ink-2);border-radius:9px;padding:9px 4px;font-size:11.5px;font-weight:600;color:var(--txt-dim);display:flex;flex-direction:column;gap:3px;align-items:center;text-align:center}
  .typebtn.on{border-color:var(--brand);color:var(--txt);background:var(--brand-deep)}
  .typebtn .em{font-size:17px}
  .respgrid{display:flex;flex-wrap:wrap;gap:7px}
  .respbtn{border:1px solid var(--line);background:var(--ink-2);border-radius:30px;padding:6px 12px 6px 9px;font-size:12.5px;font-weight:600;color:var(--txt-dim);display:flex;align-items:center;gap:7px}
  .respbtn .dot{width:11px;height:11px;border-radius:50%;background:var(--c)}
  .respbtn.on{border-color:var(--c);color:var(--txt);background:color-mix(in srgb,var(--c) 16%,transparent)}
  .respbtn:disabled{cursor:default;opacity:1}
  .resp-note{font-size:11px;color:var(--txt-faint);align-self:center;margin-left:2px}
  .donetoggle{display:flex;align-items:center;gap:9px;margin-top:14px;background:var(--ink-2);border:1px solid var(--line);border-radius:9px;padding:11px 12px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--txt-dim)}
  .donetoggle.on{border-color:var(--brand);color:var(--txt)}
  .donetoggle .box{width:19px;height:19px;border-radius:5px;border:1.5px solid var(--txt-faint);display:grid;place-items:center;font-size:13px;flex:none}
  .donetoggle.on .box{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
  .modal-actions{display:flex;gap:9px;margin-top:20px}
  .modal-actions .btn{flex:1;justify-content:center;padding:11px}
  .del{flex:none!important;border-color:transparent;background:transparent;color:var(--danger)}
  .del:hover{background:rgba(242,103,92,.12)}
  .del.armed{background:var(--danger);color:#fff;border-color:var(--danger)}

  .member{display:flex;align-items:center;gap:10px;background:var(--ink-2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:8px}
  .member input.tname{flex:1;background:transparent;border:none;color:var(--txt);font-family:inherit;font-size:14px;font-weight:600}
  .member input.tname:focus{outline:none}
  .member input.tcolor{width:30px;height:30px;border:none;background:none;padding:0;border-radius:8px;cursor:pointer;flex:none}
  .member .rm{color:var(--txt-faint);font-size:18px;flex:none}
  .member .rm:hover{color:var(--danger)}

  .copybox{background:var(--ink-2);border:1px solid var(--line);border-radius:10px;padding:13px;font-size:13px;white-space:pre-wrap;line-height:1.5;max-height:300px;overflow:auto;color:var(--txt-dim)}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--brand);color:var(--on-brand);padding:11px 20px;border-radius:30px;font-weight:700;font-size:13.5px;opacity:0;transition:.25s;z-index:90;box-shadow:var(--shadow)}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .loading{display:grid;place-items:center;min-height:50vh;color:var(--txt-dim);gap:12px}
  .spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .empty-hint{color:var(--txt-faint);font-size:12.5px;margin-top:6px}

  @media(max-width:720px){
    .cell{min-height:84px}
    .period{min-width:118px;font-size:16px}
    .grid-head div{font-size:10px;text-align:center;padding:0}
    .spacer{flex-basis:100%}
  }

  /* week load + range */
  .wr-time{width:84px!important}
  .wd-load{font-size:10.5px;color:var(--txt-faint);margin-top:3px}

  /* day summary + capacity */
  .day-summary{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;background:var(--ink-2);border:1px solid var(--line-soft);border-radius:12px;padding:12px 15px;margin-bottom:12px;font-size:14px;color:var(--txt-dim)}
  .day-summary b{color:var(--txt)}

<!-- Polyfill de window.storage -> localStorage (mantém a API do ambiente original) -->
<script>
  (function(){
    var PREFIX='floow:';
    function k(key){return PREFIX+key;}
    window.storage={
      get:function(key /*, shared */){
        return Promise.resolve().then(function(){
          var raw=localStorage.getItem(k(key));
          return raw===null?null:{value:raw};
        });
      },
      set:function(key,value /*, shared */){
        return Promise.resolve().then(function(){
          localStorage.setItem(k(key), typeof value==='string'?value:JSON.stringify(value));
          return {ok:true};
        });
      },
      delete:function(key /*, shared */){
        return Promise.resolve().then(function(){
          localStorage.removeItem(k(key));
          return {ok:true};
        });
      },
      list:function(/* shared */){
        return Promise.resolve().then(function(){
          var keys=[];
          for(var i=0;i<localStorage.length;i++){
            var f=localStorage.key(i);
            if(f&&f.indexOf(PREFIX)===0)keys.push(f.slice(PREFIX.length));
          }
          return {keys:keys};
        });
      }
    };
    // A agenda aguarda esta Promise antes de ler os dados. O backend opcional
    // (Supabase, em /src/main.js) a resolve quando termina de configurar.
    var resolved=false, _resolve;
    window.__storageReady=new Promise(function(r){
      _resolve=function(){ if(!resolved){resolved=true;r();} };
    });
    window.__resolveStorageReady=function(){ if(_resolve)_resolve(); };
    // Rede de segurança: libera mesmo que o módulo falhe ao carregar.
    setTimeout(function(){ window.__resolveStorageReady(); }, 2500);
  })();
</script>

/* mescla duas listas (eventos/clientes) por id, mantendo a versão mais recente
   e respeitando exclusões (tombstones). Evita que um cliente apague o que o
   outro criou ao salvar por cima. */
function mergeArrById(remoteArr,localArr,tomb){
  const map={};
  (remoteArr||[]).forEach(x=>{if(x&&x.id)map[x.id]=x;});
  (localArr||[]).forEach(x=>{
    if(!x||!x.id)return;
    const ex=map[x.id];
    if(!ex)map[x.id]=x;
    else map[x.id]=((x.updatedAt||0)>=(ex.updatedAt||0))?x:ex;
  });
  return Object.values(map).filter(x=>{
    const t=tomb[x.id];
    return !(t&&t>=(x.updatedAt||0)); // removido depois da última edição
  });
}
function mergeTomb(a,b){
  const out={...(a||{})};
  Object.entries(b||{}).forEach(([id,ts])=>{if(!out[id]||ts>out[id])out[id]=ts;});
  return out;
}
function mergeStates(remote,local){
  if(!remote)return local;
  if(!local)return remote;
  const rt=remote.tombstones||{}, lt=local.tombstones||{};
  const tomb={events:mergeTomb(rt.events,lt.events),clients:mergeTomb(rt.clients,lt.clients)};
  return {
    ...remote, ...local, // users/types/checklist = versão de quem está salvando (alterações deliberadas)
    events:mergeArrById(remote.events,local.events,tomb.events),
    clients:mergeArrById(remote.clients,local.clients,tomb.clients),
    tombstones:tomb,
    version:9
  };
}
let saveChain=Promise.resolve();
async function saveData(){
  // serializa as gravações e mescla com o remoto antes de escrever
  saveChain=saveChain.then(async()=>{
    try{
      let remote=null;
      try{const r=await window.storage.get(STORE_KEY,true);if(r&&r.value)remote=JSON.parse(r.value);}catch(e){}
      if(remote)state=mergeStates(remote,state);
      await window.storage.set(STORE_KEY,JSON.stringify(state),true);
    }catch(e){console.error(e);toast('Erro ao salvar');}
  });
  return saveChain;
}

function renderHours(app){
  const c=hoursWeek;let startIso,endIso,period,scope;

  else{const s=startOfWeek(c),e=new Date(s);e.setDate(s.getDate()+6);startIso=iso(s);endIso=iso(e);period=`${s.getDate()} ${MONTHS_S[s.getMonth()]} – ${e.getDate()} ${MONTHS_S[e.getMonth()]}`;scope='na semana';}

  app.insertAdjacentHTML('beforeend',`
    <div class="toolbar">
      <div class="nav"><button class="arrow" onclick="hoursStep(-1)">‹</button><div class="period">${period}</div><button class="arrow" onclick="hoursStep(1)">›</button></div>
      <button class="btn ghost" onclick="hoursToday()">Hoje</button>

        <button class="${hoursView==='week'?'on':''}" onclick="setHoursView('week')">Semana</button>
        <button class="${hoursView==='month'?'on':''}" onclick="setHoursView('month')">Mês</button>

/* ---------- DAY view (Google-Calendar-style timeline) ---------- */
const DAY_START=0, DAY_END=24, HOURPX=56;
function renderDay(app){
  const d=cursor;const evs=eventsOn(d);
  const load=dayLoad(d);
  const today=sameDay(d,new Date());

  const sum=document.createElement('div');sum.className='day-summary';
  sum.innerHTML=`<div><b>${load.count}</b> demanda${load.count===1?'':'s'} no dia${load.mins?` · <b>${fmtDur(load.mins)}</b> agendadas`:''}${!isAdmin()?` · ${esc(currentUser.name)}`:''}</div>
    <div class="cap">${load.count?capacityBar(load.mins):'<span class="empty-hint" style="margin:0">Dia livre</span>'}</div>`;
  app.appendChild(sum);

  const untimed=evs.filter(e=>!e.time);
  if(untimed.length){
    const u=document.createElement('div');u.className='untimed';
    u.innerHTML=`<span class="ut-lbl">Sem horário</span>`+untimed.map(x=>{const c=respColor(x.resp);return `<span class="ut-chip${x.done?' done':''}" style="--c:${c}" onclick="openEv('${x.id}')">${typeOf(x.type).em} ${esc(x.title)} · ${esc(clientName(x.clientId))}</span>`;}).join('');
    app.appendChild(u);
  }

  const timed=evs.filter(e=>toMin(e.time)!=null).slice().sort((a,b)=>toMin(a.time)-toMin(b.time));
  const lanes=packLanes(timed);
  const grid=document.createElement('div');grid.className='daygrid';
  grid.style.height=((DAY_END-DAY_START)*HOURPX)+'px';
  let hours='';
  for(let h=DAY_START;h<=DAY_END;h++){
    hours+=`<div class="hrow" style="top:${(h-DAY_START)*HOURPX}px">${h<24?`<span class="hlbl">${pad(h)}:00</span>`:''}</div>`;
  }
  grid.innerHTML=hours;
  grid.onclick=e=>{
    if(!e.target.classList.contains('daygrid')&&!e.target.classList.contains('hrow'))return;
    const y=e.offsetY;const h=Math.min(23,DAY_START+Math.floor(y/HOURPX));
    openEv(null,iso(d));setTimeout(()=>{$('#fTime').value=`${pad(h)}:00`;autoEnd();},30);
  };
  timed.forEach(x=>{
    const s=toMin(x.time);let en=toMin(x.end);if(en==null||en<=s)en=s+45;
    const top=(s-DAY_START*60)/60*HOURPX;
    const height=Math.max((en-s)/60*HOURPX-3,22);
    const c=respColor(x.resp);
    const lane=lanes.lane[x.id], cols=lanes.cols[x.id];
    const w=`calc((100% - 58px)/${cols})`;
    const left=`calc(58px + (100% - 58px)/${cols}*${lane})`;
    const blk=document.createElement('div');
    blk.className='dblk'+(x.done?' done':'');
    blk.style.cssText=`--c:${c};top:${top}px;height:${height}px;left:${left};width:${w}`;
    blk.onclick=ev=>{ev.stopPropagation();openEv(x.id);};
    blk.innerHTML=`<div class="db-t">${typeOf(x.type).em} ${esc(x.title)}</div><div class="db-s">${fmtRange(x)} · ${esc(clientName(x.clientId))}${x.loc?' · 📍'+esc(x.loc):''}</div><div class="db-r">${esc(respName(x.resp))}</div>`;
    grid.appendChild(blk);
  });
  if(today){
    const now=new Date();const nm=now.getHours()*60+now.getMinutes();
    if(nm>=DAY_START*60&&nm<=DAY_END*60){
      const line=document.createElement('div');line.className='nowline';
      line.style.top=((nm-DAY_START*60)/60*HOURPX)+'px';grid.appendChild(line);
    }
  }
  const dgWrap=document.createElement('div');dgWrap.className='daygrid-wrap';dgWrap.appendChild(grid);app.appendChild(dgWrap);
  // abre a grade já na hora atual (ou ~07h em outros dias), já que mostramos 24h
  const scrollTo=today?Math.max(0,(new Date().getHours()-1)*HOURPX):7*HOURPX;
  setTimeout(()=>{dgWrap.scrollTop=scrollTo;},0);
}
function capacityBar(mins){
  const max=8*60;const pct=Math.min(100,Math.round(mins/max*100));
  const col=pct<60?'var(--ok)':pct<90?'var(--brand)':'var(--danger)';
  return `<div class="capbar"><span style="width:${pct}%;background:${col}"></span></div><span class="caplbl">${pct}% de 8h</span>`;
}
function packLanes(evs){
  // simple lane packing for overlapping timed events
  const lane={},cols={};const active=[];
  evs.forEach(e=>{
    const s=toMin(e.time);let en=toMin(e.end);if(en==null||en<=s)en=s+45;
    for(let i=active.length-1;i>=0;i--){if(active[i].end<=s)active.splice(i,1);}
    const used=new Set(active.map(a=>a.lane));let l=0;while(used.has(l))l++;
    lane[e.id]=l;active.push({end:en,lane:l,id:e.id});
  });
  // compute columns per overlap cluster
  evs.forEach(e=>{
    const s=toMin(e.time);let en=toMin(e.end);if(en==null||en<=s)en=s+45;
    let maxLane=lane[e.id];
    evs.forEach(o=>{const os=toMin(o.time);let oe=toMin(o.end);if(oe==null||oe<=os)oe=os+45;
      if(os<en&&oe>s)maxLane=Math.max(maxLane,lane[o.id]);});
    cols[e.id]=maxLane+1;
  });
  // unify cols within clusters
  evs.forEach(e=>{
    const s=toMin(e.time);let en=toMin(e.end);if(en==null||en<=s)en=s+45;
    let m=cols[e.id];
    evs.forEach(o=>{const os=toMin(o.time);let oe=toMin(o.end);if(oe==null||oe<=os)oe=os+45;
      if(os<en&&oe>s)m=Math.max(m,cols[o.id]);});
    cols[e.id]=m;
  });
  return {lane,cols};
}

function parseClientLine(line){
  let s=line.trim();if(!s)return null;
  // formats: "#43 | Name", "43 | Name", "43 - Name", "43. Name", "43 Name", "Name"
  let m=s.match(/^#?\s*(\d+)\s*[|\-–—.:)]\s*(.+)$/)||s.match(/^#?\s*(\d+)\s+(.+)$/);
  if(m)return{code:m[1],name:m[2].trim()};
  return{code:'',name:s.replace(/^#/,'').trim()};
}

  const evs=state.events.filter(e=>e.clientId===cid).sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));
  if(!evs.length)return 'Esse cliente ainda não tem tarefas.';
  const mset=[...new Set(evs.map(e=>parseISO(e.date).getMonth()))];
  const monthLabel=mset.length===1?MONTHS[mset[0]]:'agenda';
  let out=`📅 Agenda *${clientName(cid)}* — ${monthLabel}\n`;
  evs.forEach(ev=>{
    const d=parseISO(ev.date);
    const datePart=`${DOW[d.getDay()]} (${pad(d.getDate())}/${pad(d.getMonth()+1)}/${String(d.getFullYear()).slice(2)})`;
    const timePart=ev.time?(ev.end?` das ${ev.time} às ${ev.end}`:` às ${ev.time}`):'';
    const head=`*${typeOf(ev.type).em} ${ev.title}*`;
    const line=`${datePart}${timePart}`;
    if(ev.done){out+=`\n~${head}~\n~${line} feito ✅~${ev.loc?`\n${ev.loc}`:''}\n`;}
    else{out+=`\n${head}\n${line}${ev.loc?`\n${ev.loc}`:''}\n`;}
  });
  return out.trim();
}
function renderCopy(){$('#copyBox').textContent=buildCopyText();}
function doCopy(){const txt=buildCopyText();const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Copiado! Cole no WhatsApp 📋');}catch(e){toast('Selecione e copie');}document.body.removeChild(ta);}

function refreshClientDatalist(){$('#clientList').innerHTML=state.clients.slice().sort((a,b)=>a.name.localeCompare(b.name,'pt')).map(c=>`<option value="${esc(c.name)}">`).join('');}

/* ---------- integração com o Google Agenda ---------- */
const GCAL_SCOPE='https://www.googleapis.com/auth/calendar.events';
const GCAL_TZ='America/Sao_Paulo';
let gAccessToken=null, gTokenClient=null, gTokenExpiry=0, gPendingAfterAuth=null;
function googleClientId(){return window.GOOGLE_CLIENT_ID||'';}
function googleLibReady(){return typeof google!=='undefined'&&google.accounts&&google.accounts.oauth2;}
function gConnectedFlag(){return localStorage.getItem('floow-gcal-connected')==='1';}
function gInitTokenClient(){
  if(gTokenClient||!googleLibReady()||!googleClientId())return gTokenClient;
  gTokenClient=google.accounts.oauth2.initTokenClient({
    client_id:googleClientId(),
    scope:GCAL_SCOPE,
    callback:resp=>{
      if(resp&&resp.access_token){
        gAccessToken=resp.access_token;
        gTokenExpiry=Date.now()+((resp.expires_in?resp.expires_in*1000:3300000)-60000);
        localStorage.setItem('floow-gcal-connected','1');
        renderUserChip();const g=$('#gcalCfg');if(g)renderGcalConfig();
        if(gPendingAfterAuth){const f=gPendingAfterAuth;gPendingAfterAuth=null;f();}
        else toast('📅 Google Agenda conectado');
      }
    }
  });
  return gTokenClient;
}
function connectGoogle(){
  if(!googleClientId()){toast('⚠️ Falta configurar o Google (client ID). Veja GOOGLE.md');return;}
  if(!googleLibReady()){toast('Carregando o Google… tente de novo em alguns segundos');return;}
  gInitTokenClient();
  gTokenClient.requestAccessToken({prompt:gConnectedFlag()?'':'consent'});
}
function gEnsureToken(cb){
  if(gAccessToken&&Date.now()<gTokenExpiry){cb();return;}
  if(!googleClientId()||!googleLibReady())return;
  gInitTokenClient();gPendingAfterAuth=cb;
  gTokenClient.requestAccessToken({prompt:''});
}
function shouldSyncGoogle(ev){
  if(!ev||!gConnectedFlag())return false;
  const u=userById(ev.resp);
  return !!(u&&u.googleSync);
}
function gcalPayload(ev){
  const body={
    summary:`${typeOf(ev.type).em} ${ev.title} · ${clientName(ev.clientId)}`,
    description:`Agenda FLOOW Digital\nResponsável: ${respName(ev.resp)}`
  };
  if(ev.time){
    const end=ev.end||addMinHHMM(ev.time,60);
    body.start={dateTime:`${ev.date}T${ev.time}:00`,timeZone:GCAL_TZ};
    body.end={dateTime:`${ev.date}T${end}:00`,timeZone:GCAL_TZ};
  }else{
    body.start={date:ev.date};body.end={date:nextDay(ev.date)};
  }
  const u=userById(ev.resp);
  if(u&&u.email&&/@/.test(u.email))body.attendees=[{email:u.email}];
  return body;
}
function syncEventToGoogle(ev){
  if(!shouldSyncGoogle(ev))return;
  gEnsureToken(()=>{
    const isUpdate=!!ev.gcalId;
    const base='https://www.googleapis.com/calendar/v3/calendars/primary/events';
    const url=base+(isUpdate?'/'+encodeURIComponent(ev.gcalId):'')+'?sendUpdates=all';
    fetch(url,{method:isUpdate?'PATCH':'POST',headers:{'Authorization':'Bearer '+gAccessToken,'Content-Type':'application/json'},body:JSON.stringify(gcalPayload(ev))})
      .then(r=>r.json()).then(data=>{
        if(data&&data.error){console.warn('gcal',data.error);toast('Falha ao criar no Google');return;}
        if(data&&data.id&&!ev.gcalId){ev.gcalId=data.id;saveData();}
        toast('📅 Criado no Google Agenda do '+respName(ev.resp));
      }).catch(e=>{console.warn('gcal',e);toast('Falha ao sincronizar no Google');});
  });
}
function deleteGoogleEvent(ev){
  if(!ev||!ev.gcalId||!gConnectedFlag())return;
  gEnsureToken(()=>{
    fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events/'+encodeURIComponent(ev.gcalId)+'?sendUpdates=all',{method:'DELETE',headers:{'Authorization':'Bearer '+gAccessToken}}).catch(()=>{});
  });
}
function renderGcalConfig(){
  const wrap=$('#gcalCfg');if(!wrap)return;
  const idSet=!!googleClientId();const conn=gConnectedFlag();
  wrap.innerHTML=`
    <div class="cfg-row" style="flex-wrap:wrap;gap:10px">
      <div style="flex:1;min-width:170px">
        <div style="font-weight:700">${conn?'✅ Google conectado':'Google não conectado'}</div>
        <div class="empty-hint" style="margin:4px 0 0">${idSet?'As entregas dos usuários marcados com 📅 viram evento no Google e o responsável é convidado pelo e-mail.':'⚠️ Falta a credencial do Google (VITE_GOOGLE_CLIENT_ID na Vercel). Veja o guia GOOGLE.md.'}</div>
      </div>
      <button class="btn ${conn?'':'primary'}" onclick="connectGoogle()">${conn?'Reconectar Google':'Conectar Google'}</button>
    </div>`;
}

/* ---------- notificações: avisar 20 min antes de cada tarefa ---------- */
const NOTIFY_LEAD=20; // minutos de antecedência
let notifyTimer=null, notifyReady=false;
function notifyKey(ev){return 'floow-notified:'+ev.date+':'+ev.id;}
function cleanNotifyKeys(){
  try{const today=iso(new Date());for(let i=localStorage.length-1;i>=0;i--){const k=localStorage.key(i);if(!k)continue;
    const isNotif=k.indexOf('floow-notified:')===0||k.indexOf('floow-started:')===0;
    if(isNotif&&k.indexOf(':'+today+':')===-1)localStorage.removeItem(k);
  }}catch(e){}
}
function setupNotifications(){
  if(!('Notification' in window))return;
  cleanNotifyKeys();
  if(notifyTimer)clearInterval(notifyTimer);
  checkUpcomingNotifications();
  notifyTimer=setInterval(checkUpcomingNotifications,30000); // checa a cada 30s
}
function requestNotifyPermission(){
  if(!('Notification' in window)){toast('Este navegador não suporta avisos');return;}
  if(Notification.permission==='granted'){toast('🔔 Avisos já ativados');setupNotifications();return;}
  Notification.requestPermission().then(p=>{
    renderUserChip();
    if(p==='granted'){toast('🔔 Avisos ativados');setupNotifications();}
    else toast('Avisos bloqueados — libere nas permissões do site');
  }).catch(()=>{});
}
function fireNotif(title,ev,tagSuffix){
  try{new Notification(title,{
    body:`${typeOf(ev.type).em} ${ev.title} · ${clientName(ev.clientId)}`+(fmtRange(ev)?'\n'+fmtRange(ev):''),
    icon:'/icon.svg',tag:ev.id+(tagSuffix||'')
  });}catch(e){}
}
function checkUpcomingNotifications(){
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  if(!currentUser||!state||!state.events)return;
  const now=new Date();const todayIso=iso(now);const nowMin=now.getHours()*60+now.getMinutes();
  state.events.forEach(ev=>{
    if(ev.done||ev.resp!==currentUser.id||ev.date!==todayIso)return;
    const s=toMin(ev.time);if(s==null)return;
    const diff=s-nowMin;
    // 1) aviso de antecedência: de 20 min até 1 min antes
    if(diff>=1&&diff<=NOTIFY_LEAD){
      const key='floow-notified:'+ev.date+':'+ev.id;
      if(!localStorage.getItem(key)){localStorage.setItem(key,'1');fireNotif('⏰ Tarefa em '+diff+' min',ev,'-pre');}
    }
    // 2) aviso na hora de iniciar: do horário até 2 min depois (tolerância)
    if(diff<=0&&diff>=-2){
      const key='floow-started:'+ev.date+':'+ev.id;
      if(!localStorage.getItem(key)){localStorage.setItem(key,'1');fireNotif('▶️ Hora de começar',ev,'-start');}
    }
  });
}

let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2200);}
document.querySelectorAll('.scrim').forEach(s=>s.addEventListener('click',e=>{if(e.target===s)s.classList.remove('on');}));

(async()=>{
  try{ if(window.__storageReady) await window.__storageReady; }catch(e){}
  await load();render();
})();
